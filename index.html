<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visitas Técnicas</title>
<meta name="theme-color" content="#1d4ed8">
<meta name="description" content="Gestión y auditoría de visitas técnicas a tiendas">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Visitas">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body { background: #f1f5f9; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1e293b; }
  .pt-safe { padding-top: env(safe-area-inset-top); }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #miniMap { position: relative; z-index: 0; }
  .nav-btn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; font-size: 11px; color: #64748b; }
  .nav-btn.active { color: #2563eb; font-weight: 600; }
  .spinner { width: 42px; height: 42px; border: 4px solid #bfdbfe; border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .me-dot { width: 18px; height: 18px; background: #f97316; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 4px rgba(249,115,22,.3); }
  .leaflet-popup-content { margin: 10px 12px; }
  .inp { width: 100%; border: 1px solid #cbd5e1; background: #fff; border-radius: 12px; padding: 10px 12px; font-size: 16px; outline: none; }
  .inp:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.2); }
  .inp[readonly] { background: #f1f5f9; color: #475569; }
  .btn { display: inline-block; text-align: center; border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 15px; transition: transform .1s; }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .5; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-outline { background: #fff; color: #1d4ed8; border: 1px solid #2563eb; }
  .btn-danger { background: #dc2626; color: #fff; }
  .btn-ghost { background: #e2e8f0; color: #334155; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .badge { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .lbl { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
</style>
</head>
<body>

<canvas id="cv" class="hidden"></canvas>

<div id="loading" class="hidden fixed inset-0 z-[3000] bg-white/70 flex items-center justify-center"><div class="spinner"></div></div>
<div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 z-[4000] max-w-[92%] px-4 py-2 rounded-xl text-sm text-white shadow-lg" style="top: calc(env(safe-area-inset-top) + 12px)"></div>

<!-- ======================= LOGIN ======================= -->
<div id="login" class="hidden fixed inset-0 overflow-y-auto bg-gradient-to-b from-blue-700 to-sky-500">
  <div class="min-h-full flex flex-col justify-center px-6 py-10">
    <div class="max-w-sm w-full mx-auto">
      <div class="text-center text-white mb-6">
        <img src="icons/icon-192.png" alt="" class="w-20 h-20 mx-auto rounded-2xl shadow-lg mb-3">
        <h1 class="text-2xl font-bold">Visitas Técnicas</h1>
        <p class="text-blue-100 text-sm">Auditoría de bodegas, markets y minimarkets</p>
      </div>
      <form id="loginForm" class="bg-white rounded-2xl p-5 shadow-xl space-y-3" autocomplete="on">
        <div><label class="lbl" for="lgUser">Usuario</label><input id="lgUser" class="inp" autocomplete="username" autocapitalize="none" autocorrect="off" required></div>
        <div>
          <label class="lbl" for="lgPass">Contraseña</label>
          <div class="relative">
            <input id="lgPass" type="password" class="inp pr-16" autocomplete="current-password" required>
            <button type="button" id="lgToggle" class="absolute right-2 top-1/2 -translate-y-1/2 text-sm text-blue-600 px-2">Ver</button>
          </div>
        </div>
        <div id="lgErr" class="hidden text-sm text-red-600 bg-red-50 rounded-lg p-2"></div>
        <button id="lgBtn" class="btn btn-primary w-full">Iniciar sesión</button>
      </form>
    </div>
  </div>
</div>

<!-- ======================= APP SHELL ======================= -->
<div id="shell" class="hidden fixed inset-0 flex flex-col">
  <header class="bg-blue-700 text-white pt-safe">
    <div class="flex items-center justify-between px-4 py-3">
      <h1 id="hdrTitle" class="text-lg font-semibold">Inicio</h1>
      <button id="btnSync" class="text-sm bg-white/15 rounded-lg px-3 py-1.5">↻ Actualizar</button>
    </div>
    <div id="offBanner" class="hidden bg-amber-500 text-xs text-center py-1">Sin conexión — mostrando datos guardados</div>
  </header>

  <main class="relative flex-1 min-h-0">
    <!-- INICIO -->
    <section id="v-inicio" class="view hidden absolute inset-0 overflow-y-auto"><div id="inicioBody" class="p-3 space-y-3 pb-24"></div></section>

    <!-- PENDIENTES -->
    <section id="v-pend" class="view hidden absolute inset-0 overflow-y-auto">
      <div class="sticky top-0 z-10 bg-slate-100 p-3 space-y-2">
        <input id="qPend" type="search" class="inp" placeholder="Buscar por nombre o ID de tienda">
        <div id="supBarPend" class="hidden flex gap-2">
          <select id="selTecPend" class="inp flex-1"></select>
          <button id="btnAsignar" class="btn btn-primary">Asignar</button>
        </div>
        <div id="cargaChips" class="hidden flex flex-wrap gap-1.5"></div>
        <button id="btnFuera" class="btn btn-outline w-full">+ Visita fuera de ruta</button>
      </div>
      <div id="listPend" class="p-3 pt-1 space-y-2 pb-28"></div>
    </section>

    <!-- MAPA -->
    <section id="v-mapa" class="view hidden absolute inset-0">
      <div id="map" class="absolute inset-0"></div>
      <div class="absolute top-2 left-2 right-2 z-[1000] flex gap-2 items-center">
        <label class="bg-white rounded-xl shadow px-3 py-2 text-sm flex items-center gap-2"><input id="chkRes" type="checkbox"> Resueltas</label>
        <select id="selTecMapa" class="hidden flex-1 min-w-0 bg-white rounded-xl shadow px-2 py-2 text-sm"></select>
        <button id="btnLocate" class="ml-auto bg-white rounded-xl shadow px-3 py-2 text-lg" title="Mi ubicación">📍</button>
      </div>
    </section>

    <!-- RESUELTAS -->
    <section id="v-res" class="view hidden absolute inset-0 overflow-y-auto">
      <div class="sticky top-0 z-10 bg-slate-100 p-3 space-y-2">
        <input id="qRes" type="search" class="inp" placeholder="Buscar por tienda, ID o estado">
        <select id="selTecRes" class="hidden inp"></select>
      </div>
      <div id="listRes" class="p-3 pt-1 space-y-2 pb-24"></div>
    </section>

    <button id="fab" class="hidden absolute right-4 bottom-4 z-[1000] w-14 h-14 rounded-full bg-blue-600 text-white text-3xl leading-none shadow-lg active:scale-95" aria-label="Visita fuera de ruta">+</button>
  </main>

  <nav class="bg-white border-t border-slate-200 grid grid-cols-4 pb-safe">
    <button class="nav-btn" data-nav="inicio">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span>Inicio</span>
    </button>
    <button class="nav-btn" data-nav="pend">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 12h6M9 16h4"/></svg><span>Pendientes</span>
      <span id="navBadge" class="hidden absolute top-1 left-1/2 ml-2 bg-red-600 text-white text-[10px] rounded-full px-1.5 min-w-[18px] text-center"></span>
    </button>
    <button class="nav-btn" data-nav="mapa">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6 2V6l6-2 6 2 6-2v16l-6 2-6-2zM9 4v16M15 6v16"/></svg><span>Mapa</span>
    </button>
    <button class="nav-btn" data-nav="res">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg><span>Resueltas</span>
    </button>
  </nav>
</div>

<!-- ======================= MODAL ======================= -->
<div id="modal" class="hidden fixed inset-0 z-[2000] bg-black/50 flex items-end sm:items-center justify-center">
  <div id="modalBody" class="bg-slate-50 w-full max-w-lg overflow-y-auto rounded-t-3xl sm:rounded-3xl pb-safe" style="max-height: calc(100% - env(safe-area-inset-top) - 12px); overscroll-behavior: contain; -webkit-overflow-scrolling: touch;"></div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
 *  CONFIGURACIÓN — edita solo esta sección
 * ===================================================================== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbw6dKEb2fRyCc8wnzKjtExJBtD84xWCZ6ze0KGmuuQZHaTrfIDy4-ppnypm0o4LlO4x/exec',   // URL terminada en /exec
  GEOCERCA_METROS: 100,
  FOTO_MAX_ANCHO: 1200,
  FOTO_CALIDAD: 0.7,
  MONITOR_OBLIGATORIO_FISICA: true,          // foto del monitor obligatoria en Visita Física (fachada es opcional); debe coincidir con Code.gs
  SESION_KEY: 'vt_sesion',
  CACHE_KEY: 'vt_cache'
};

const TIPOS = ['Visita Física', 'Visita Remota', 'No Visitado'];
const STATUS = ['Activa Validada', 'Activa Sin Validación', 'Avería ISP', 'Avería NUC/RB', 'Avería CAM', 'Avería Otros', 'Tienda Cerrada', 'Solicitud de Retiro'];
const STATUS_COLOR = {
  'Activa Validada': 'bg-green-100 text-green-700',
  'Activa Sin Validación': 'bg-lime-100 text-lime-700',
  'Avería ISP': 'bg-red-100 text-red-700',
  'Avería NUC/RB': 'bg-red-100 text-red-700',
  'Avería CAM': 'bg-orange-100 text-orange-700',
  'Avería Otros': 'bg-orange-100 text-orange-700',
  'Tienda Cerrada': 'bg-slate-200 text-slate-700',
  'Solicitud de Retiro': 'bg-purple-100 text-purple-700'
};

/* =====================================================================
 *  UTILIDADES
 * ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const isNum = n => typeof n === 'number' && isFinite(n);
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();

function fmt(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/.exec(String(s || ''));
  if (!m) return s ? esc(s) : '—';
  return `${m[3]}/${m[2]}/${m[1]}${m[4] ? ' ' + m[4] + ':' + m[5] : ''}`;
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function driveDirect(url) {
  if (!url) return '';
  const m = /\/d\/([\w-]+)/.exec(url) || /[?&]id=([\w-]+)/.exec(url);
  if (m && /drive\.google\.com|docs\.google\.com/.test(url)) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w400`;
  return url;
}

let toastTimer;
function toast(msg, type = 'info') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = `fixed left-1/2 -translate-x-1/2 z-[4000] max-w-[92%] px-4 py-2 rounded-xl text-sm text-white shadow-lg ${type === 'error' ? 'bg-red-600' : type === 'ok' ? 'bg-green-600' : type === 'warn' ? 'bg-amber-600' : 'bg-slate-800'}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 4000);
}
const showLoading = b => $('#loading').classList.toggle('hidden', !b);

async function getDevice() {
  const ua = navigator.userAgent;
  let os = 'Desconocido';
  if (/Android/i.test(ua)) os = 'Android';
  else if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) os = 'iOS';
  else if (/Windows/i.test(ua)) os = 'Windows';
  else if (/CrOS/i.test(ua)) os = 'ChromeOS';
  else if (/Mac OS X|Macintosh/i.test(ua)) os = 'macOS';
  else if (/Linux/i.test(ua)) os = 'Linux';
  let br = 'Navegador';
  let brave = false;
  try { brave = !!(navigator.brave && await navigator.brave.isBrave()); } catch (_) {}
  if (brave) br = 'Brave';
  else if (/EdgA|EdgiOS|Edg\//.test(ua)) br = 'Edge';
  else if (/OPR\/|OPiOS/.test(ua)) br = 'Opera';
  else if (/SamsungBrowser/.test(ua)) br = 'Samsung Internet';
  else if (/Firefox|FxiOS/.test(ua)) br = 'Firefox';
  else if (/CriOS|Chrome/.test(ua)) br = 'Chrome';
  else if (/Safari/.test(ua)) br = 'Safari';
  return `${os} - ${br}`;
}

/* =====================================================================
 *  ESTADO
 * ===================================================================== */
const S = {
  token: null, user: null, loginAt: null, device: '',
  clientes: [], visitas: [], usuarios: [],
  view: 'inicio', filtroTec: '', limiteRes: 50, mostrarResMapa: false
};
const isSup = () => S.user && S.user.Rol === 'Supervisor';
const techName = u => { const x = S.usuarios.find(y => y.Usuario === u); return x ? x.Nombre_Apellido : (S.user && S.user.Usuario === u ? S.user.Nombre_Apellido : u); };

function saveSession() { try { localStorage.setItem(CONFIG.SESION_KEY, JSON.stringify({ token: S.token, user: S.user, loginAt: S.loginAt, device: S.device })); } catch (_) {} }
function saveCache() { try { localStorage.setItem(CONFIG.CACHE_KEY, JSON.stringify({ clientes: S.clientes, visitas: S.visitas, usuarios: S.usuarios })); } catch (_) {} }
function loadSession() { try { return JSON.parse(localStorage.getItem(CONFIG.SESION_KEY)); } catch (_) { return null; } }
function loadCache() { try { return JSON.parse(localStorage.getItem(CONFIG.CACHE_KEY)); } catch (_) { return null; } }

/* =====================================================================
 *  API (Apps Script Web App) — POST text/plain evita preflight CORS
 * ===================================================================== */
async function api(action, data = {}) {
  if (/PEGA_AQUI/.test(CONFIG.API_URL)) throw new Error('Falta configurar CONFIG.API_URL en index.html');
  let res;
  try {
    res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: S.token, ...data }),
      redirect: 'follow'
    });
  } catch (e) {
    const err = new Error('Sin conexión con el servidor');
    err.offline = true;
    throw err;
  }
  let json;
  try { json = await res.json(); } catch (_) { throw new Error('Respuesta inválida del servidor'); }
  if (!json.ok) {
    if (json.code === 'AUTH') logout('Tu sesión expiró. Inicia sesión nuevamente.');
    const err = new Error(json.error || 'Error desconocido');
    err.code = json.code;
    throw err;
  }
  return json.data;
}

async function refreshData(silent) {
  try {
    if (!silent) showLoading(true);
    const d = await api('getData');
    S.clientes = d.clientes || [];
    S.visitas = d.visitas || [];
    S.usuarios = d.usuarios || [];
    if (d.user) { S.user = d.user; saveSession(); }
    saveCache();
    $('#offBanner').classList.add('hidden');
    renderAll();
  } catch (e) {
    if (e.offline) { $('#offBanner').classList.remove('hidden'); if (!silent) toast('Sin conexión: mostrando datos guardados', 'warn'); }
    else if (e.code !== 'AUTH') toast(e.message, 'error');
  } finally { showLoading(false); }
}

/* =====================================================================
 *  SESIÓN
 * ===================================================================== */
function showLogin(msg) {
  $('#shell').classList.add('hidden');
  $('#login').classList.remove('hidden');
  const er = $('#lgErr');
  if (msg) { er.textContent = msg; er.classList.remove('hidden'); } else er.classList.add('hidden');
}

function showApp() {
  $('#login').classList.add('hidden');
  $('#shell').classList.remove('hidden');
  setView(S.view);
  renderAll();
}

function logout(msg) {
  stopGps();
  closeModal();
  try { localStorage.removeItem(CONFIG.SESION_KEY); localStorage.removeItem(CONFIG.CACHE_KEY); } catch (_) {}
  Object.assign(S, { token: null, user: null, loginAt: null, clientes: [], visitas: [], usuarios: [], view: 'inicio', filtroTec: '' });
  showLogin(typeof msg === 'string' ? msg : '');
}

async function doLogin(e) {
  e.preventDefault();
  const er = $('#lgErr'); er.classList.add('hidden');
  const btn = $('#lgBtn'); btn.disabled = true; btn.textContent = 'Ingresando…';
  try {
    const device = await getDevice();
    const d = await api('login', { usuario: $('#lgUser').value.trim(), password: $('#lgPass').value, dispositivo: device });
    S.token = d.token; S.user = d.user; S.loginAt = d.loginAt; S.device = device;
    saveSession();
    $('#lgPass').value = '';
    S.view = 'inicio';
    showApp();
    primeGps(true);
    await refreshData(false);
  } catch (err) {
    er.textContent = err.message; er.classList.remove('hidden');
  } finally { btn.disabled = false; btn.textContent = 'Iniciar sesión'; }
}

/* =====================================================================
 *  NAVEGACIÓN
 * ===================================================================== */
const TITLES = { inicio: 'Panel de control', pend: 'Tareas pendientes', mapa: 'Mapa de ruta', res: 'Visitas resueltas' };

function setView(name) {
  S.view = name;
  $$('.view').forEach(v => v.classList.toggle('hidden', v.id !== 'v-' + name));
  $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === name));
  $('#hdrTitle').textContent = TITLES[name];
  $('#fab').classList.toggle('hidden', name === 'res');
  if (name === 'mapa') { initMap(); setTimeout(() => { map.invalidateSize(); renderMapa(true); }, 60); }
}

function setFiltro(u) { S.filtroTec = u || ''; renderPendientes(); renderResueltas(); if (S.view === 'mapa') renderMapa(true); syncTecSelects(); }

function renderAll() {
  syncTecSelects();
  renderInicio();
  renderPendientes();
  renderResueltas();
  if (S.view === 'mapa' && map) renderMapa(false);
  const n = S.visitas.filter(v => v.Estado_Tarea === 'Pendiente').length;
  const b = $('#navBadge'); b.textContent = n; b.classList.toggle('hidden', !n);
  $('#supBarPend').classList.toggle('hidden', !isSup());
  $('#selTecRes').classList.toggle('hidden', !isSup());
  $('#selTecMapa').classList.toggle('hidden', !isSup());
}

function syncTecSelects() {
  if (!isSup()) return;
  const opts = `<option value="">Todos los técnicos</option>` + S.usuarios.map(u =>
    `<option value="${esc(u.Usuario)}" ${S.filtroTec === u.Usuario ? 'selected' : ''}>${esc(u.Nombre_Apellido)} (${esc(u.Usuario)})</option>`).join('');
  ['#selTecPend', '#selTecRes', '#selTecMapa'].forEach(id => { $(id).innerHTML = opts; });
}

/* =====================================================================
 *  INICIO
 * ===================================================================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (S.user) renderInicio(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; if (S.user) renderInicio(); });
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/i.test(navigator.userAgent) || (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

function avatar(u, size = 'w-16 h-16', text = 'text-xl') {
  const url = driveDirect(u.URL_Foto_Perfil);
  return `<div class="relative ${size} rounded-full bg-blue-100 text-blue-700 font-bold ${text} flex items-center justify-center shrink-0 overflow-hidden">
    ${esc(initials(u.Nombre_Apellido))}
    ${url ? `<img src="${esc(url)}" alt="" referrerpolicy="no-referrer" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()">` : ''}
  </div>`;
}

function renderInicio() {
  if (!S.user) return;
  const u = S.user, hoy = todayStr();
  const pend = S.visitas.filter(v => v.Estado_Tarea === 'Pendiente');
  const resHoy = S.visitas.filter(v => v.Estado_Tarea === 'Resuelta' && String(v.Fecha_Resolucion).startsWith(hoy));
  const pendHoy = pend.filter(v => String(v.Fecha_Asignacion).startsWith(hoy)).length;

  let html = `
  <div class="card flex gap-3 items-center">
    ${avatar(u)}
    <div class="min-w-0">
      <div class="font-bold text-lg leading-tight truncate">${esc(u.Nombre_Apellido)}</div>

  $('#inicioBody').innerHTML = html;
}

/* =====================================================================
 *  PENDIENTES / RESUELTAS
 * ===================================================================== */
function filtrar(estado, q) {
  const nq = norm(q.trim());
  return S.visitas.filter(v => v.Estado_Tarea === estado
    && (!isSup() || !S.filtroTec || v.Usuario_Asignado === S.filtroTec)
    && (!nq || norm(v.Nombre_Cliente).includes(nq) || norm(v.ID_Cliente).includes(nq) || norm(v.Status_Tienda).includes(nq)));
}

function renderPendientes() {
  const list = filtrar('Pendiente', $('#qPend').value);
  if (isSup()) {
    const all = S.visitas.filter(v => v.Estado_Tarea === 'Pendiente');
    const chips = S.usuarios.filter(x => x.Rol === 'Técnico' || all.some(v => v.Usuario_Asignado === x.Usuario)).map(x => {
      const n = all.filter(v => v.Usuario_Asignado === x.Usuario).length;
      const act = S.filtroTec === x.Usuario;
      return `<button data-chip="${esc(x.Usuario)}" class="badge ${act ? 'bg-blue-600 text-white' : 'bg-white border border-slate-300 text-slate-700'}">${esc(x.Nombre_Apellido)}: ${n} pendiente${n === 1 ? '' : 's'}</button>`;
    }).join('');
    const cc = $('#cargaChips'); cc.innerHTML = chips; cc.classList.toggle('hidden', !chips);
  }
  $('#listPend').innerHTML = list.length ? list.map(v => `
    <div class="card cursor-pointer" data-vid="${esc(v.ID_Visita)}">
      <div class="flex justify-between gap-2">
        <div class="min-w-0">
          <div class="font-semibold truncate">${esc(v.Nombre_Cliente)}</div>
          <div class="text-xs text-slate-500">${esc(v.ID_Cliente)} · Asignada ${fmt(v.Fecha_Asignacion)}</div>
        </div>
        <span class="badge bg-blue-100 text-blue-700 self-start">Pendiente</span>
      </div>
      ${isSup() ? `<div class="mt-2 flex items-center justify-between text-xs"><span class="text-slate-600">👤 ${esc(techName(v.Usuario_Asignado))}</span><button class="text-blue-600 font-semibold px-2 py-1" data-reasignar="${esc(v.ID_Visita)}">Reasignar</button></div>` : ''}
    </div>`).join('') : `<div class="text-center text-slate-500 py-10 text-sm">No hay tareas pendientes 🎉</div>`;
}

function renderResueltas() {
  const all = filtrar('Resuelta', $('#qRes').value);

  $('#listRes').innerHTML = (list.length ? list.map(v => `
    <div class="card">
      <div class="flex justify-between gap-2">
        <div class="min-w-0">
          <div class="font-semibold truncate">${esc(v.Nombre_Cliente)}</div>
          <div class="text-xs text-slate-500">${esc(v.ID_Cliente)} · ${fmt(v.Fecha_Resolucion)}</div>
        </div>
        <span class="badge ${STATUS_COLOR[v.Status_Tienda] || 'bg-slate-100 text-slate-700'} self-start text-right">${esc(v.Status_Tienda)}</span>
      </div>
      <div class="mt-2 flex flex-wrap gap-1.5 text-xs">

        ${isNum(v.Distancia_Metros) ? `<span class="badge bg-slate-100 text-slate-700">${Math.round(v.Distancia_Metros)} m</span>` : ''}

/* =====================================================================
 *  MAPA PRINCIPAL
 * ===================================================================== */
let map = null, pinLayer = null, meMarker = null;

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<svg width="30" height="40" viewBox="0 0 30 40"><path d="M15 1C7 1 1 7 1 15c0 10.5 14 24 14 24s14-13.5 14-24C29 7 23 1 15 1z" fill="${color}" stroke="#fff" stroke-width="2"/><circle cx="15" cy="15" r="5.5" fill="#fff"/></svg>`,
    iconSize: [30, 40], iconAnchor: [15, 40], popupAnchor: [0, -36]
  });
}
const meIcon = () => L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });

function initMap() {
  if (map) return;
  map = L.map('map', { zoomControl: false }).setView([-12.0464, -77.0428], 12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  L.control.zoom({ position: 'bottomleft' }).addTo(map);
  pinLayer = L.layerGroup().addTo(map);
  map.on('popupopen', ev => {
    const el = ev.popup.getElement();
    $$('[data-resolver]', el).forEach(b => b.addEventListener('click', () => { map.closePopup(); openVisita(b.dataset.resolver); }));
  });
}

function renderMapa(fit) {
  if (!map) return;
  pinLayer.clearLayers();
  const items = S.visitas.filter(v =>
    (v.Estado_Tarea === 'Pendiente' || (S.mostrarResMapa && v.Estado_Tarea === 'Resuelta'))
    && (!isSup() || !S.filtroTec || v.Usuario_Asignado === S.filtroTec)
    && isNum(v.Latitud_Tienda) && isNum(v.Longitud_Tienda));
  const pts = [];
  items.forEach(v => {
    const pendiente = v.Estado_Tarea === 'Pendiente';
    const m = L.marker([v.Latitud_Tienda, v.Longitud_Tienda], { icon: pinIcon(pendiente ? '#2563eb' : '#16a34a') });
    m.bindPopup(`<div class="text-sm" style="min-width:190px">
      <div class="font-bold">${esc(v.Nombre_Cliente)}</div>
      <div class="text-slate-500">ID: ${esc(v.ID_Cliente)}</div>
      <div class="text-slate-500">Técnico: ${esc(techName(v.Usuario_Asignado))}</div>
      <div class="mt-1 mb-2"><span class="badge ${pendiente ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}">${pendiente ? 'Pendiente' : 'Resuelta'}</span></div>
      <a class="btn btn-outline w-full block" style="padding:6px 10px;font-size:13px" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${v.Latitud_Tienda},${v.Longitud_Tienda}&travelmode=driving">Navegar (Google Maps)</a>
      ${pendiente ? `<button class="btn btn-primary w-full block mt-2" style="padding:6px 10px;font-size:13px" data-resolver="${esc(v.ID_Visita)}">Resolver Visita</button>` : ''}
    </div>`);
    m.addTo(pinLayer);
    pts.push([v.Latitud_Tienda, v.Longitud_Tienda]);
  });
  if (fit && pts.length) map.fitBounds(pts, { padding: [50, 50], maxZoom: 16 });
}

function locateMe() {
  if (!navigator.geolocation) return toast('Tu dispositivo no soporta geolocalización', 'warn');
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (meMarker) meMarker.setLatLng(ll); else meMarker = L.marker(ll, { icon: meIcon() }).addTo(map);
    map.setView(ll, 16);
  }, () => toast('No se pudo obtener tu ubicación. Revisa los permisos de GPS.', 'warn'), { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}

/* =====================================================================
 *  MODAL
 * ===================================================================== */
const M = { onClose: null };
function openModal(html, onClose) {
  M.onClose = onClose || null;
  $('#modalBody').innerHTML = html;
  $('#modal').classList.remove('hidden');
  const body = $('#modalBody');
  body.scrollTop = 0;
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  // iOS puede desplazar el panel al renderizar mapas/inputs: se reinicia el scroll
  requestAnimationFrame(() => { body.scrollTop = 0; });
  setTimeout(() => { if (!$('#modal').classList.contains('hidden')) body.scrollTop = 0; }, 350);
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  if (M.onClose) { const f = M.onClose; M.onClose = null; try { f(); } catch (_) {} }
  $('#modal').classList.add('hidden');
  $('#modalBody').innerHTML = '';
  document.body.style.overflow = '';
}
const modalHeader = (title, extra = '') => `<div class="sticky top-0 z-10 bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between">
  <div class="font-bold text-lg">${title} ${extra}</div><button data-close class="text-2xl leading-none text-slate-500 px-2" aria-label="Cerrar">×</button></div>`;

/* ---------- Selector de clientes con buscador (autocomplete) ---------- */
function pickerHTML(id) {
  return `<div id="${id}"><input type="search" class="inp" placeholder="Buscar cliente por nombre o ID…" autocomplete="off">
    <div class="pl hidden mt-1 max-h-56 overflow-y-auto border border-slate-200 rounded-xl bg-white"></div></div>`;
}
function mountPicker(id, onPick) {
  const root = $('#' + id), inp = $('input', root), list = $('.pl', root);
  const render = () => {
    const q = norm(inp.value.trim());
    const res = S.clientes.filter(c => !q || norm(c.Nombre_Cliente).includes(q) || norm(c.ID_Cliente).includes(q)).slice(0, 40);
    list.innerHTML = res.length ? res.map(c => `<button type="button" data-id="${esc(c.ID_Cliente)}" class="w-full text-left px-3 py-2 border-b border-slate-100 last:border-0 active:bg-blue-50">
      <div class="text-sm font-medium">${esc(c.Nombre_Cliente)}</div><div class="text-xs text-slate-500">${esc(c.ID_Cliente)}</div></button>`).join('')
      : `<div class="p-3 text-sm text-slate-500">Sin resultados en la base de clientes</div>`;
    list.classList.remove('hidden');
  };
  inp.addEventListener('input', render);
  inp.addEventListener('focus', render);
  list.addEventListener('click', e => {
    const b = e.target.closest('[data-id]'); if (!b) return;
    const c = S.clientes.find(x => x.ID_Cliente === b.dataset.id); if (!c) return;
    inp.value = c.Nombre_Cliente; list.classList.add('hidden'); onPick(c);
  });
}

  openModal(`${modalHeader('Asignar nueva visita')}
    <div class="p-4 space-y-3">
      <div><label class="lbl">Cliente</label>${pickerHTML('pkAsig')}</div>
      <div id="pkInfo" class="hidden card text-sm"></div>

function openReasignar(idVisita) {

/* =====================================================================
 *  FORMULARIO DE RESOLUCIÓN DE VISITA
 * ===================================================================== */
let F = null;

function openVisita(arg) {
  let v;
  if (typeof arg === 'string') {
    v = S.visitas.find(x => x.ID_Visita === arg);
    if (!v) return toast('No se encontró la visita', 'error');
    if (v.Estado_Tarea !== 'Pendiente') return toast('Esta visita ya fue resuelta', 'warn');
  } else {
    const c = arg.cliente;
    v = { ID_Visita: '', Usuario_Asignado: S.user.Usuario, ID_Cliente: c.ID_Cliente, Nombre_Cliente: c.Nombre_Cliente, Latitud_Tienda: c.Latitud, Longitud_Tienda: c.Longitud, _fuera: true };
  }
  F = { v, fachada: null, monitor: null, pos: null, dist: null, watchId: null, mini: null, storeMarker: null, meMarker: null, fitted: false };

  openModal(`${modalHeader('Resolver visita', v._fuera ? '<span class="badge bg-amber-100 text-amber-700 align-middle">Fuera de ruta</span>' : '')}
  <div class="p-4 space-y-4">
    <div class="card space-y-2">
      <div class="grid grid-cols-2 gap-2">
        <div><label class="lbl">Usuario asignado</label><input class="inp" readonly value="${esc(v.Usuario_Asignado)}"></div>
        <div><label class="lbl">ID Cliente</label><input class="inp" readonly value="${esc(v.ID_Cliente)}"></div>
      </div>
      <div><label class="lbl">Nombre del cliente</label><input class="inp" readonly value="${esc(v.Nombre_Cliente)}"></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="lbl">Latitud</label><input class="inp" readonly value="${esc(v.Latitud_Tienda)}"></div>
        <div><label class="lbl">Longitud</label><input class="inp" readonly value="${esc(v.Longitud_Tienda)}"></div>
      </div>
    </div>

    <div class="card space-y-2">
      <div id="miniMap" class="w-full h-48 rounded-xl overflow-hidden"></div>
      <div id="distBox" class="rounded-xl p-2 text-sm bg-slate-100 text-slate-700">Obteniendo ubicación GPS…</div>
      <button id="btnRecal" type="button" class="btn btn-ghost w-full">📡 Recalibrar GPS</button>
    </div>

    <div>
      <label class="lbl">Tipo de visita *</label>
      <select id="fTipo" class="inp"><option value="">Selecciona…</option>${TIPOS.map(t => `<option>${t}</option>`).join('')}</select>
      <p class="text-xs text-slate-500 mt-1">“Visita Física” solo se permite a ${CONFIG.GEOCERCA_METROS} m o menos de la tienda.</p>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="lbl">Foto de fachada <span class="font-normal text-slate-400">(opcional)</span></label>
        <label for="fFachada" class="btn btn-outline w-full block text-sm">📷 Tomar foto</label>
        <input id="fFachada" type="file" accept="image/*" capture="environment" class="hidden">
        <img id="prevFachada" alt="" class="hidden mt-2 w-full h-28 object-cover rounded-xl border">
      </div>
      <div>
        <label class="lbl">Foto del monitor <span class="font-normal text-slate-400">(obligatoria)</span></label>
        <label for="fMonitor" class="btn btn-outline w-full block text-sm">📷 Tomar foto</label>
        <input id="fMonitor" type="file" accept="image/*" capture="environment" class="hidden">
        <img id="prevMonitor" alt="" class="hidden mt-2 w-full h-28 object-cover rounded-xl border">
      </div>
    </div>

    <div>
      <label class="lbl">Status *</label>
      <select id="fStatus" class="inp"><option value="">Selecciona…</option>${STATUS.map(t => `<option>${t}</option>`).join('')}</select>
    </div>
    <div><label class="lbl">Observación</label><textarea id="fObs" rows="3" class="inp" placeholder="Comentarios adicionales…"></textarea></div>

    <div id="fErr" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-xl p-2"></div>
    <div class="grid grid-cols-2 gap-3">
      <button data-close class="btn btn-ghost">Cancelar</button>
      <button id="btnGuardar" class="btn btn-primary">Guardar visita</button>
    </div>
  </div>`, cleanupVisita);

  // mini-mapa
  const hasStore = isNum(v.Latitud_Tienda) && isNum(v.Longitud_Tienda);
  F.mini = L.map('miniMap', { zoomControl: true }).setView(hasStore ? [v.Latitud_Tienda, v.Longitud_Tienda] : [-12.0464, -77.0428], 17);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(F.mini);
  if (hasStore) F.storeMarker = L.marker([v.Latitud_Tienda, v.Longitud_Tienda], { icon: pinIcon('#2563eb') }).addTo(F.mini);
  setTimeout(() => F.mini && F.mini.invalidateSize(), 250);

  $('#btnRecal').addEventListener('click', recalibrarGps);
  $('#fTipo').addEventListener('change', e => {
    if (e.target.value === 'Visita Física') {
      const g = geofenceError();
      if (g) { alert('⚠️ ' + g); e.target.value = ''; }

  });
  $('#fFachada').addEventListener('change', e => onFoto('fachada', e.target, 'prevFachada'));
  $('#fMonitor').addEventListener('change', e => onFoto('monitor', e.target, 'prevMonitor'));
  $('#btnGuardar').addEventListener('click', guardarVisita);
  startGps();
}

function cleanupVisita() {
  stopGps();
  if (F && F.mini) { try { F.mini.remove(); } catch (_) {} }
  F = null;
}

/* ---------- GPS ---------- */
function startGps() {
  stopGps();
  if (!navigator.geolocation) return gpsMsg('Tu dispositivo no soporta geolocalización.', true);
  F.watchId = navigator.geolocation.watchPosition(onPos, onGpsErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}
function stopGps() { if (F && F.watchId !== null && navigator.geolocation) { navigator.geolocation.clearWatch(F.watchId); F.watchId = null; } }
function recalibrarGps() {
  if (!F) return;
  F.pos = null; F.dist = null; F.fitted = false;
  gpsMsg('Recalibrando GPS…', false);
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition(onPos, onGpsErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  startGps();
}
function onGpsErr(err) {
  const m = { 1: 'Permiso de ubicación denegado. Actívalo en los ajustes del navegador.', 2: 'Ubicación no disponible. Sal a un lugar abierto e inténtalo de nuevo.', 3: 'Tiempo de espera agotado. Pulsa “Recalibrar GPS”.' };
  gpsMsg(m[err.code] || 'No se pudo obtener el GPS.', true);
}
function gpsMsg(text, bad) {
  const b = $('#distBox'); if (!b) return;
  b.className = `rounded-xl p-2 text-sm ${bad ? 'bg-red-50 text-red-700' : 'bg-slate-100 text-slate-700'}`;
  b.textContent = text;
}
function onPos(p) {
  if (!F) return;
  F.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
  const ll = [F.pos.lat, F.pos.lng];
  if (F.mini) {
    if (F.meMarker) F.meMarker.setLatLng(ll); else F.meMarker = L.marker(ll, { icon: meIcon() }).addTo(F.mini);
    if (!F.fitted && F.storeMarker) { F.fitted = true; F.mini.fitBounds([ll, F.storeMarker.getLatLng()], { padding: [30, 30], maxZoom: 18 }); }
  }
  updateDist();
}
function updateDist() {
  if (!F || !F.pos) return;
  const v = F.v;
  if (!isNum(v.Latitud_Tienda) || !isNum(v.Longitud_Tienda)) return gpsMsg('La tienda no tiene coordenadas válidas.', true);
  F.dist = haversine(F.pos.lat, F.pos.lng, v.Latitud_Tienda, v.Longitud_Tienda);
  const ok = F.dist <= CONFIG.GEOCERCA_METROS;
  const b = $('#distBox'); if (!b) return;
  b.className = `rounded-xl p-2 text-sm ${ok ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-700'}`;
  b.innerHTML = `<b class="text-base">${Math.round(F.dist)} m</b> de la tienda · ${ok ? '✅ Dentro de la geocerca' : `⛔ Fuera de geocerca (máx. ${CONFIG.GEOCERCA_METROS} m para Visita Física)`}
    <div class="text-xs opacity-75">Precisión GPS ±${Math.round(F.pos.acc)} m</div>`;
}
function geofenceError() {
  if (!F.pos) return 'Aún no hay señal GPS. Espera a que se detecte tu ubicación o pulsa “Recalibrar GPS”.';
  if (F.dist === null) return 'La tienda no tiene coordenadas válidas.';
  if (F.dist > CONFIG.GEOCERCA_METROS) return `Estás a ${Math.round(F.dist)} metros de la tienda. Para registrar una Visita Física debes estar a ${CONFIG.GEOCERCA_METROS} m o menos.`;
  return null;
}

/* ---------- Fotos (compresión en cliente) ---------- */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const cv = $('#cv');
        const scale = Math.min(1, CONFIG.FOTO_MAX_ANCHO / img.naturalWidth);
        const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const data = cv.toDataURL('image/jpeg', CONFIG.FOTO_CALIDAD);
        URL.revokeObjectURL(url);
        resolve(data);
      } catch (e) { reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}
async function onFoto(kind, input, prevId) {
  const f = input.files && input.files[0]; if (!f || !F) return;
  try {
    const data = await compressImage(f);
    F[kind] = data;
    const pv = $('#' + prevId); pv.src = data; pv.classList.remove('hidden');
  } catch (e) { toast(e.message, 'error'); }
}

/* ---------- Guardar ---------- */
function fErr(msg) { const e = $('#fErr'); e.textContent = msg; e.classList.remove('hidden'); e.scrollIntoView({ behavior: 'smooth', block: 'center' }); }

async function guardarVisita() {
  if (!F) return;
  $('#fErr').classList.add('hidden');
  const tipo = $('#fTipo').value, status = $('#fStatus').value, obs = $('#fObs').value.trim();
  if (!tipo) return fErr('Selecciona el tipo de visita.');
  if (!status) return fErr('Selecciona el Status de la tienda.');
  if (tipo === 'Visita Física') {
    const g = geofenceError();
    if (g) { alert('⚠️ ' + g); return; }
    if (CONFIG.MONITOR_OBLIGATORIO_FISICA && !F.monitor) return fErr('Para una Visita Física debes adjuntar la foto del monitor.');
  }
  const v = F.v;
  const btn = $('#btnGuardar'); btn.disabled = true; btn.textContent = 'Guardando…';
  showLoading(true);
  try {
    await api('resolveVisit', {
      idVisita: v.ID_Visita || '',
      fueraDeRuta: !!v._fuera,
      idCliente: v.ID_Cliente,
      tipoVisita: tipo,
      status,
      observacion: obs,
      latReal: F.pos ? F.pos.lat : null,
      lngReal: F.pos ? F.pos.lng : null,
      fotoFachada: F.fachada,
      fotoMonitor: F.monitor
    });
    toast('Visita guardada correctamente', 'ok');
    closeModal();
    await refreshData(true);
  } catch (e) {
    showLoading(false);
    if (e.code === 'GEOFENCE') alert('⚠️ ' + e.message); else fErr(e.message);
    btn.disabled = false; btn.textContent = 'Guardar visita';
  } finally { showLoading(false); }
}

/* =====================================================================
 *  PERFIL: CAMBIAR CONTRASEÑA
 * ===================================================================== */
function openPass() {
  openModal(`${modalHeader('Cambiar contraseña')}
    <div class="p-4 space-y-3">
      <div><label class="lbl">Contraseña actual</label><input id="pwA" type="password" class="inp" autocomplete="current-password"></div>
      <div><label class="lbl">Nueva contraseña (mín. 6)</label><input id="pwN" type="password" class="inp" autocomplete="new-password"></div>
      <div><label class="lbl">Repetir nueva contraseña</label><input id="pwR" type="password" class="inp" autocomplete="new-password"></div>
      <div id="pwErr" class="hidden text-sm text-red-700 bg-red-50 rounded-xl p-2"></div>
      <button id="btnPwOk" class="btn btn-primary w-full">Guardar</button>
    </div>`);
  $('#btnPwOk').addEventListener('click', async () => {
    const er = $('#pwErr'); er.classList.add('hidden');
    const a = $('#pwA').value, n = $('#pwN').value, r = $('#pwR').value;
    const bad = m => { er.textContent = m; er.classList.remove('hidden'); };
    if (!a) return bad('Ingresa tu contraseña actual.');
    if (n.length < 6) return bad('La nueva contraseña debe tener al menos 6 caracteres.');
    if (n !== r) return bad('Las contraseñas nuevas no coinciden.');
    try { showLoading(true); await api('changePassword', { actual: a, nueva: n }); toast('Contraseña actualizada', 'ok'); closeModal(); }
    catch (e) { bad(e.message); } finally { showLoading(false); }
  });
}

/* =====================================================================
 *  GESTIÓN DE USUARIOS (Supervisor)
 * ===================================================================== */
function openUsers() {
  openModal(`${modalHeader('Gestión de usuarios')}
    <div class="p-4 space-y-4">
      <div class="card space-y-2" id="usersList">
        ${S.usuarios.map(u => `
          <div class="flex items-center gap-3 py-1 border-b border-slate-100 last:border-0">
            ${avatar(u, 'w-10 h-10', 'text-sm')}
            <div class="min-w-0 flex-1">
              <div class="text-sm font-semibold truncate">${esc(u.Nombre_Apellido)}</div>
              <div class="text-xs text-slate-500 truncate">@${esc(u.Usuario)} · ${esc(u.Rol)}${u.Correo ? ' · ' + esc(u.Correo) : ''}</div>
            </div>
            ${u.ID_Usuario !== S.user.ID_Usuario ? `<button class="text-red-600 text-sm font-semibold px-2 py-1" data-deluser="${esc(u.ID_Usuario)}">Eliminar</button>` : '<span class="text-xs text-slate-400">Tú</span>'}
          </div>`).join('')}
      </div>
      <div class="card space-y-2">
        <div class="font-semibold">Nuevo usuario</div>
        <input id="nuUser" class="inp" placeholder="Usuario (sin espacios)" autocapitalize="none" autocomplete="off">
        <input id="nuPass" type="text" class="inp" placeholder="Contraseña inicial (mín. 6)" autocomplete="off">
        <input id="nuName" class="inp" placeholder="Nombre y apellido">
        <select id="nuRol" class="inp"><option value="Técnico">Técnico</option><option value="Supervisor">Supervisor</option></select>
        <input id="nuMail" type="email" class="inp" placeholder="Correo (opcional)">
        <input id="nuTel" type="tel" class="inp" placeholder="Teléfono (opcional)">
        <input id="nuFoto" type="url" class="inp" placeholder="URL de foto de perfil (opcional)">
        <div id="nuErr" class="hidden text-sm text-red-700 bg-red-50 rounded-xl p-2"></div>
        <button id="btnNuOk" class="btn btn-primary w-full">Crear usuario</button>
      </div>
    </div>`);
  $$('[data-deluser]').forEach(b => b.addEventListener('click', async () => {
    const u = S.usuarios.find(x => x.ID_Usuario === b.dataset.deluser);
    if (!u || !confirm(`¿Eliminar a ${u.Nombre_Apellido} (@${u.Usuario})? Esta acción no se puede deshacer.`)) return;
    try { showLoading(true); await api('deleteUser', { idUsuario: u.ID_Usuario }); toast('Usuario eliminado', 'ok'); await refreshData(true); openUsers(); }
    catch (e) { toast(e.message, 'error'); } finally { showLoading(false); }
  }));
  $('#btnNuOk').addEventListener('click', async () => {
    const er = $('#nuErr'); er.classList.add('hidden');
    try {
      showLoading(true);
      await api('createUser', { usuario: $('#nuUser').value.trim(), password: $('#nuPass').value, nombre: $('#nuName').value.trim(), rol: $('#nuRol').value, correo: $('#nuMail').value.trim(), telefono: $('#nuTel').value.trim(), fotoUrl: $('#nuFoto').value.trim() });
      toast('Usuario creado', 'ok'); await refreshData(true); openUsers();
    } catch (e) { er.textContent = e.message; er.classList.remove('hidden'); } finally { showLoading(false); }
  });
}

/* =====================================================================
 *  HISTORIAL DE LOGINS (Supervisor)
 * ===================================================================== */
async function openLogs() {
  openModal(`${modalHeader('Historial de inicios de sesión')}<div class="p-4"><div class="text-center text-slate-500 py-8">Cargando…</div></div>`);
  try {
    const logs = await api('getLogs');
    const draw = filtro => {
      const rows = logs.filter(l => !filtro || l.Usuario === filtro);
      $('#logsList').innerHTML = rows.length ? rows.map(l => `
        <div class="py-2 border-b border-slate-100 last:border-0 text-sm">
          <div class="flex justify-between"><b>${esc(techName(l.Usuario))}</b><span class="text-xs text-slate-500">${fmt(l.Timestamp)}</span></div>
          <div class="text-xs text-slate-500">@${esc(l.Usuario)} · ${esc(l.Rol)} · ${esc(l.Dispositivo_UserAgent)}</div>
        </div>`).join('') : '<div class="text-sm text-slate-500 py-4 text-center">Sin registros</div>';
    };
    $('#modalBody').innerHTML = `${modalHeader('Historial de inicios de sesión')}
      <div class="p-4 space-y-3">
        <select id="logFiltro" class="inp"><option value="">Todos los usuarios</option>${S.usuarios.map(u => `<option value="${esc(u.Usuario)}">${esc(u.Nombre_Apellido)} (${esc(u.Usuario)})</option>`).join('')}</select>
        <div class="card" id="logsList"></div>
        <p class="text-xs text-slate-400 text-center">Mostrando los últimos ${logs.length} accesos.</p>
      </div>`;
    draw('');
    $('#logFiltro').addEventListener('change', e => draw(e.target.value));
  } catch (e) { toast(e.message, 'error'); closeModal(); }
}

/* =====================================================================
 *  EVENTOS
 * ===================================================================== */
function bindEvents() {
  $('#loginForm').addEventListener('submit', doLogin);
  $('#lgToggle').addEventListener('click', () => { const i = $('#lgPass'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; $('#lgToggle').textContent = show ? 'Ocultar' : 'Ver'; });

  $$('.nav-btn').forEach(b => b.addEventListener('click', () => setView(b.dataset.nav)));
  $('#btnSync').addEventListener('click', () => refreshData(false));
  $('#fab').addEventListener('click', openFueraRuta);
  $('#btnFuera').addEventListener('click', openFueraRuta);
  $('#btnAsignar').addEventListener('click', openAsignar);

  $('#qPend').addEventListener('input', renderPendientes);
  $('#qRes').addEventListener('input', () => { S.limiteRes = 50; renderResueltas(); });
  ['#selTecPend', '#selTecRes', '#selTecMapa'].forEach(id => $(id).addEventListener('change', e => setFiltro(e.target.value)));
  $('#chkRes').addEventListener('change', e => { S.mostrarResMapa = e.target.checked; renderMapa(true); });
  $('#btnLocate').addEventListener('click', () => { initMap(); locateMe(); });

  $('#listPend').addEventListener('click', e => {
    const re = e.target.closest('[data-reasignar]');
    if (re) { e.stopPropagation(); return openReasignar(re.dataset.reasignar); }
    const c = e.target.closest('[data-vid]'); if (c) openVisita(c.dataset.vid);
  });
  $('#cargaChips').addEventListener('click', e => { const c = e.target.closest('[data-chip]'); if (c) setFiltro(S.filtroTec === c.dataset.chip ? '' : c.dataset.chip); });
  $('#listRes').addEventListener('click', e => { if (e.target.closest('#btnMasRes')) { S.limiteRes += 50; renderResueltas(); } });

  $('#inicioBody').addEventListener('click', async e => {
    const t = e.target.closest('[data-tec]');
    if (t) { setFiltro(t.dataset.tec); return setView('pend'); }
    if (e.target.closest('#btnPass')) return openPass();
    if (e.target.closest('#btnUsers')) return openUsers();
    if (e.target.closest('#btnLogs')) return openLogs();
    if (e.target.closest('#btnLogout')) { if (confirm('¿Cerrar sesión?')) logout(); return; }
    if (e.target.closest('#btnInstall') && deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; renderInicio(); }
  });

  $('#modal').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });

  window.addEventListener('online', () => { $('#offBanner').classList.add('hidden'); if (S.token) refreshData(true); });
  window.addEventListener('offline', () => { if (S.token) $('#offBanner').classList.remove('hidden'); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.token && !F) refreshData(true); });
}

/* =====================================================================
 *  INICIO DE LA APP
 * ===================================================================== */
/* Pide el permiso de GPS una sola vez, al iniciar sesión (gesto del usuario), para que no
   aparezca en medio del formulario. Si el permiso ya está concedido, solo "calienta" el GPS. */
async function primeGps(force) {
  if (!navigator.geolocation) return;
  let state = 'prompt';
  try { if (navigator.permissions && navigator.permissions.query) state = (await navigator.permissions.query({ name: 'geolocation' })).state; } catch (_) {}
  if (state === 'denied') return;
  if (state === 'prompt' && !force) return;
  navigator.geolocation.getCurrentPosition(() => {}, () => {}, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}

function init() {
  bindEvents();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const ses = loadSession();
  if (ses && ses.token && ses.user) {
    Object.assign(S, { token: ses.token, user: ses.user, loginAt: ses.loginAt, device: ses.device || '' });
    const c = loadCache();
    if (c) Object.assign(S, { clientes: c.clientes || [], visitas: c.visitas || [], usuarios: c.usuarios || [] });
    showApp();
    refreshData(true);
    primeGps(false);
    if (!S.device) getDevice().then(d => { S.device = d; saveSession(); renderInicio(); });
  } else {
    showLogin();
  }
}
init();
})();
