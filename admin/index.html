<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de Supervisión · Visitas Técnicas</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="../icons/admin-192.png">
<link rel="apple-touch-icon" href="../icons/admin-apple-touch.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Supervisión">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
  html, body { margin: 0; }
  #sidebar { padding-bottom: env(safe-area-inset-bottom); }
  #content { padding-bottom: calc(1.25rem + env(safe-area-inset-bottom)); }
  body { background: #f1f5f9; color: #1e293b; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  input[type=checkbox], input[type=radio] { width: 18px; height: 18px; accent-color: #2563eb; flex-shrink: 0; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .inp { width: 100%; border: 1px solid #cbd5e1; background: #fff; border-radius: 10px; padding: 8px 10px; font-size: 14px; outline: none; }
  .inp:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.18); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 14px; transition: .1s; white-space: nowrap; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; pointer-events: none; }
  .btn-primary { background: #2563eb; color: #fff; } .btn-primary:hover { background: #1d4ed8; }
  .btn-ghost { background: #e2e8f0; color: #334155; } .btn-ghost:hover { background: #cbd5e1; }
  .btn-outline { background: #fff; border: 1px solid #cbd5e1; color: #334155; } .btn-outline:hover { background: #f8fafc; }
  .btn-danger { background: #dc2626; color: #fff; } .btn-danger:hover { background: #b91c1c; }
  .chip { border: 1px solid #cbd5e1; background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; color: #475569; }
  .chip:hover { background: #f1f5f9; }
  .chip-on { background: #1d4ed8 !important; border-color: #1d4ed8; color: #fff; }
  .badge { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .kpi { padding: 14px; transition: box-shadow .15s, transform .1s; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; text-align: left; width: 100%; }
  .kpi > * { width: 100%; }
  .kpi:hover { box-shadow: 0 4px 14px rgba(15,23,42,.1); }
  .kpi:active { transform: scale(.99); }
  .navb { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 10px; font-size: 14px; color: #cbd5e1; text-align: left; }
  .navb:hover { background: #1e293b; }
  .navb.on { background: #2563eb; color: #fff; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
  .row:hover { background: #f8fafc; }
  table.t { width: 100%; font-size: 13px; border-collapse: collapse; }
  table.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: #64748b; padding: 8px; background: #f8fafc; white-space: nowrap; }
  table.t td { padding: 8px; border-top: 1px solid #f1f5f9; vertical-align: top; }
  table.t tr.clk { cursor: pointer; } table.t tr.clk:hover td { background: #f8fafc; }
  .sec { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #64748b; margin: 18px 0 8px; }
  .spinner { width: 40px; height: 40px; border: 4px solid #bfdbfe; border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chartbox { position: relative; width: 100%; }
</style>
</head>
<body>

<div id="loading" class="hidden fixed inset-0 z-[3000] bg-white/70 flex flex-col items-center justify-center gap-3">
  <div class="spinner"></div><div id="loadingMsg" class="text-sm font-medium text-slate-600">Cargando…</div>
</div>
<div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 top-3 z-[4000] max-w-[92%] px-4 py-2 rounded-xl text-sm text-white shadow-lg"></div>

<!-- ============ LOGIN ============ -->
<div id="login" class="hidden min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-blue-900 to-sky-700 p-4">
  <form id="loginForm" class="card w-full max-w-sm p-6 space-y-3 shadow-2xl">
    <div class="text-center mb-2">
      <img src="../icons/admin-192.png" alt="" class="w-16 h-16 mx-auto rounded-2xl shadow mb-2">
      <h1 class="text-xl font-bold">Panel de Supervisión</h1>
      <p class="text-sm text-slate-500">Acceso exclusivo para Supervisores</p>
    </div>
    <div><label class="text-sm font-semibold text-slate-600" for="lgUser">Usuario</label><input id="lgUser" class="inp mt-1" autocomplete="username" autocapitalize="none" autocorrect="off" required></div>
    <div><label class="text-sm font-semibold text-slate-600" for="lgPass">Contraseña</label><input id="lgPass" type="password" class="inp mt-1" autocomplete="current-password" required></div>
    <div id="lgErr" class="hidden text-sm text-red-700 bg-red-50 rounded-lg p-2"></div>
    <button id="lgBtn" class="btn btn-primary w-full">Ingresar</button>
    <button type="button" class="js-install hidden w-full text-center text-sm text-blue-600 font-medium pt-1">⬇ Instalar esta app en tu dispositivo</button>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden min-h-screen">
  <div id="backdrop" class="hidden fixed inset-0 bg-black/50 z-30 lg:hidden"></div>

  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 text-slate-200 flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="flex items-center gap-3 px-4 py-4 border-b border-slate-800">
      <img src="../icons/admin-192.png" alt="" class="w-9 h-9 rounded-lg">
      <div class="leading-tight"><div class="font-bold text-white">Visitas Técnicas</div><div class="text-xs text-slate-400">Panel de Supervisión</div></div>
    </div>
    <nav id="nav" class="flex-1 overflow-y-auto p-3 space-y-1"></nav>
    <div class="p-3 border-t border-slate-800 space-y-2">
      <div class="flex items-center gap-2 px-1">
        <div id="uAvatar" class="w-9 h-9 rounded-full bg-blue-600 text-white font-bold text-sm flex items-center justify-center"></div>
        <div class="min-w-0 leading-tight"><div id="uName" class="text-sm font-semibold text-white truncate"></div><div class="text-xs text-slate-400">Supervisor</div></div>
      </div>
      <button id="btnInstall" class="js-install navb !py-2 !text-xs hidden">⬇ Instalar app</button>
      <a href="../index.html" class="navb !py-2 !text-xs">↗ Abrir app de campo</a>
      <button id="btnLogout" class="navb !py-2 !text-xs">⎋ Cerrar sesión</button>
    </div>
  </aside>

  <div class="lg:pl-64 min-h-screen flex flex-col">
    <header class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-slate-200">
      <div class="flex items-center gap-3 px-3 sm:px-5 py-3">
        <button id="btnMenu" class="lg:hidden p-2 -ml-2 rounded-lg hover:bg-slate-100" aria-label="Menú">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 id="title" class="text-lg font-bold flex-1 truncate">Dashboard</h1>
        <span id="updated" class="hidden sm:inline text-xs text-slate-400"></span>
        <button id="btnRefresh" class="btn btn-outline !py-1.5">↻ <span class="hidden sm:inline">Actualizar</span></button>
      </div>
    </header>
    <main id="content" class="flex-1 p-3 sm:p-5 max-w-[1500px] w-full mx-auto">
      <section id="v-dash" class="view hidden"></section>
      <section id="v-asig" class="view hidden"></section>
      <section id="v-pend" class="view hidden"></section>
      <section id="v-hist" class="view hidden"></section>
      <section id="v-tiendas" class="view hidden"></section>
      <section id="v-equipo" class="view hidden"></section>
      <section id="v-logs" class="view hidden"></section>
    </main>
  </div>
</div>

<div id="modal" class="hidden fixed inset-0 z-[2000] bg-black/50 flex items-center justify-center p-3">
  <div id="modalBody" class="bg-white w-full max-w-lg max-h-[92vh] overflow-y-auto rounded-2xl"></div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
 *  CONFIGURACIÓN — usa la MISMA URL /exec que en index.html
 * ===================================================================== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxIezb0_xich82oQaUuiMuDDDvLWgpCyvcYVIcA84BwPLmMjoVBOwb3sbLi9NmKh7QXxA/exec',
  SESION_KEY: 'vta_sesion',
  AUTO_REFRESH_MS: 60000,
  LOTE_ASIGNAR: 300,
  LOTE_REASIGNAR: 300,
  LOTE_ELIMINAR: 150,
  PAGE: 100
};

const TIPOS = ['Visita Física', 'Visita Remota', 'No Visitado'];
const ACT = ['Activa Validada', 'Activa Sin Validación'];
const AV = ['Avería ISP', 'Avería NUC/RB', 'Avería CAM', 'Avería Otros'];
const INC = [...ACT, ...AV, 'Tienda Cerrada', 'Solicitud de Retiro'];
const COLOR = {
  'Visita Física': '#2563eb', 'Visita Remota': '#8b5cf6', 'No Visitado': '#94a3b8',
  'Activa Validada': '#16a34a', 'Activa Sin Validación': '#84cc16',
  'Avería ISP': '#dc2626', 'Avería NUC/RB': '#ea580c', 'Avería CAM': '#f59e0b', 'Avería Otros': '#be185d',
  'Tienda Cerrada': '#475569', 'Solicitud de Retiro': '#7c3aed'
};
const VCOLS = ['ID_Visita', 'Fecha_Asignacion', 'Usuario_Asignado', 'ID_Cliente', 'Nombre_Cliente', 'Latitud_Tienda', 'Longitud_Tienda', 'Estado_Tarea', 'Tipo_Visita', 'Status_Tienda', 'URL_Foto_Fachada', 'URL_Foto_Monitor', 'Observacion', 'Fecha_Resolucion', 'Lat_Real_Tecnico', 'Lng_Real_Tecnico', 'Distancia_Metros', 'Es_Fuera_De_Ruta', 'Retiro_Equipos', 'Reinstalacion_Equipo', 'USB_Monitor', 'Mantenimiento', 'Confirma_Equipo', 'Confirma_USB', 'Retiro_USB', 'Seguimiento_De'];

// Retiro de equipos (solo Visita Física + Avería NUC/RB). '' = sin retiro
const RET = { nuc: 'NUC', rb: 'RB' };   // solo se recoge uno por visita
const REI_COLOR = { 'NUC': '#059669', 'RB': '#34d399', usb: '#6366f1', mant: '#64748b' };
const RET_COLOR = { 'NUC': '#0ea5e9', 'RB': '#8b5cf6', '': '#94a3b8' };

const ICONS = {
  dash: '<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
  assign: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
  pend: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 12h6M9 16h4"/>',
  hist: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
  store: '<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M10 20v-6h4v6"/>',
  team: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  logs: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const NAV = [
  ['dash', 'Dashboard', 'dash'], ['asig', 'Asignación masiva', 'assign'], ['pend', 'Visitas pendientes', 'pend'],
  ['hist', 'Historial de visitas', 'hist'], ['tiendas', 'Información de Tienda', 'store'], ['equipo', 'Equipo', 'team'], ['logs', 'Accesos', 'logs']
];
const TITLES = { dash: 'Dashboard', asig: 'Asignación masiva', pend: 'Visitas pendientes', hist: 'Historial de visitas', tiendas: 'Información de Tienda', equipo: 'Equipo', logs: 'Accesos al sistema' };

/* =====================================================================
 *  UTILIDADES
 * ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dOf = s => String(s || '').slice(0, 10);
const n0 = n => Number(n || 0).toLocaleString('es-PE');
const pct = (a, b) => b ? Math.round(a * 1000 / b) / 10 : 0;
const isNum = n => typeof n === 'number' && isFinite(n);
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const col = s => COLOR[s] || '#64748b';
const chunk = (a, n) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };

function fmtDT(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/.exec(String(s || ''));
  if (!m) return s ? esc(s) : '—';
  return `${m[3]}/${m[2]}/${m[1]}${m[4] ? ' ' + m[4] + ':' + m[5] : ''}`;
}
function fmtD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; }

let toastTimer;
function toast(msg, type = 'info') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = `fixed left-1/2 -translate-x-1/2 top-3 z-[4000] max-w-[92%] px-4 py-2 rounded-xl text-sm text-white shadow-lg ${type === 'error' ? 'bg-red-600' : type === 'ok' ? 'bg-green-600' : type === 'warn' ? 'bg-amber-600' : 'bg-slate-800'}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 4500);
}
function showLoading(b, msg) { $('#loading').classList.toggle('hidden', !b); $('#loadingMsg').textContent = msg || 'Cargando…'; }
function openModal(html) { $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); $('#modalBody').innerHTML = ''; }
const ico = k => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

async function getDevice() {
  const ua = navigator.userAgent;
  let os = 'Desconocido';
  if (/Android/i.test(ua)) os = 'Android';
  else if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) os = 'iOS';
  else if (/Windows/i.test(ua)) os = 'Windows';
  else if (/CrOS/i.test(ua)) os = 'ChromeOS';
  else if (/Mac OS X|Macintosh/i.test(ua)) os = 'macOS';
  else if (/Linux/i.test(ua)) os = 'Linux';
  let br = 'Navegador', brave = false;
  try { brave = !!(navigator.brave && await navigator.brave.isBrave()); } catch (_) {}
  if (brave) br = 'Brave';
  else if (/EdgA|EdgiOS|Edg\//.test(ua)) br = 'Edge';
  else if (/OPR\/|OPiOS/.test(ua)) br = 'Opera';
  else if (/Firefox|FxiOS/.test(ua)) br = 'Firefox';
  else if (/CriOS|Chrome/.test(ua)) br = 'Chrome';
  else if (/Safari/.test(ua)) br = 'Safari';
  return `Panel web · ${os} - ${br}`;
}

/* =====================================================================
 *  ESTADO
 * ===================================================================== */
const S = {
  token: null, user: null, usuarios: [], clientes: [], visitas: [], updated: null,
  clientMap: {}, pendByClient: {},
  view: 'dash', rango: { preset: 'hoy', desde: '', hasta: '' }, filtroTec: '',
  drill: null, drillPage: 1, drillList: [],
  asig: { q: '', ocultarPend: true, sel: new Set(), modo: 'zonas', destino: '', tecs: new Set(), tecsInit: false, omitir: true, page: 1 },
  pend: { q: '', tec: '', soloAtras: false, sel: new Set(), page: 1 },
  hist: { q: '', tipo: '', status: '', fuera: false, page: 1 },
  tienda: { q: '', filtro: '', distrito: '', sel: '', page: 1, data: null, hoja: true, setup: false, hist: {}, chk: new Set() },
  logs: [], logsFiltro: '', timer: null
};
const U = u => S.usuarios.find(x => x.Usuario === u);
const nameOf = u => (U(u) || {}).Nombre_Apellido || u;
const shortName = t => { const n = String((t && (t.Nombre_Apellido || t.Usuario)) || ''); return n.length > 24 ? n.slice(0, 22) + '…' : n; };

/* =====================================================================
 *  API
 * ===================================================================== */
async function api(action, data = {}) {
  if (/PEGA_AQUI/.test(CONFIG.API_URL)) throw new Error('Falta configurar CONFIG.API_URL en admin.html');
  let res;
  try {
    res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, ...data }), redirect: 'follow' });
  } catch (e) { const err = new Error('Sin conexión con el servidor'); err.offline = true; throw err; }
  let json;
  try { json = await res.json(); } catch (_) { throw new Error('Respuesta inválida del servidor'); }
  if (!json.ok) {
    if (json.code === 'AUTH') logout('Tu sesión expiró. Inicia sesión nuevamente.');
    const err = new Error(json.error || 'Error desconocido'); err.code = json.code; throw err;
  }
  return json.data;
}

/* =====================================================================
 *  SESIÓN
 * ===================================================================== */
function saveSession() { try { localStorage.setItem(CONFIG.SESION_KEY, JSON.stringify({ token: S.token, user: S.user })); } catch (_) {} }
function loadSession() { try { return JSON.parse(localStorage.getItem(CONFIG.SESION_KEY)); } catch (_) { return null; } }

function showLogin(msg) {
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  const er = $('#lgErr'); if (msg) { er.textContent = msg; er.classList.remove('hidden'); } else er.classList.add('hidden');
}
function logout(msg) {
  clearInterval(S.timer); closeModal(); destroyCharts();
  try { localStorage.removeItem(CONFIG.SESION_KEY); } catch (_) {}
  Object.assign(S, { token: null, user: null, usuarios: [], clientes: [], visitas: [], drill: null });
  S.tienda = { q: '', filtro: '', distrito: '', sel: '', page: 1, data: null, hoja: true, setup: false, hist: {}, chk: new Set() };
  S.asig.sel.clear(); S.pend.sel.clear();
  showLogin(typeof msg === 'string' ? msg : '');
}

function enterApp() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#uName').textContent = S.user.Nombre_Apellido; $('#uAvatar').textContent = initials(S.user.Nombre_Apellido);
  if (!S.rango.desde) setPreset('hoy');
  renderNav(); go(S.view || 'dash');
  loadData(false);
  clearInterval(S.timer);
  S.timer = setInterval(() => { if (document.visibilityState === 'visible' && S.token) loadData(true); }, CONFIG.AUTO_REFRESH_MS);
}

/* =====================================================================
 *  DATOS
 * ===================================================================== */
function setPreset(p) {
  const t = new Date(); let d = new Date(t), h = new Date(t);
  if (p === 'ayer') { d.setDate(d.getDate() - 1); h = new Date(d); }
  else if (p === '7d') d.setDate(d.getDate() - 6);
  else if (p === '30d') d.setDate(d.getDate() - 29);
  else if (p === 'mes') d = new Date(t.getFullYear(), t.getMonth(), 1);
  S.rango = { preset: p, desde: ymd(d), hasta: ymd(h) };
}

function indexData() {
  S.clientMap = {}; S.clientes.forEach(c => { S.clientMap[c.ID_Cliente] = c; });
  S.pendByClient = {};
  S.visitas.forEach(v => { if (v.Estado_Tarea === 'Pendiente') (S.pendByClient[v.ID_Cliente] = S.pendByClient[v.ID_Cliente] || []).push(v); });
  const pendIds = new Set(S.visitas.filter(v => v.Estado_Tarea === 'Pendiente').map(v => v.ID_Visita));
  S.pend.sel = new Set([...S.pend.sel].filter(id => pendIds.has(id)));
  S.asig.sel = new Set([...S.asig.sel].filter(id => S.clientMap[id]));
}

async function loadData(silent) {
  try {
    if (!silent) showLoading(true);
    const d = await api('adminData', { desde: S.rango.desde, hasta: S.rango.hasta });
    S.usuarios = d.usuarios || []; S.clientes = d.clientes || []; S.visitas = d.visitas || []; S.segs = d.segs || []; S.cerradas = d.cerradas || null; S.updated = new Date();
    indexData();
    $('#updated').textContent = 'Actualizado ' + S.updated.toLocaleTimeString('es-PE');
    renderCurrent(silent);
  } catch (e) {
    if (e.offline) { if (!silent) toast('Sin conexión con el servidor', 'warn'); }
    else if (e.code !== 'AUTH') toast(e.message, 'error');
  } finally { showLoading(false); }
}

const pendCount = u => S.visitas.filter(v => v.Estado_Tarea === 'Pendiente' && v.Usuario_Asignado === u).length;
function orderedUsers() { return [...S.usuarios].sort((a, b) => (a.Rol === b.Rol ? 0 : a.Rol === 'Técnico' ? -1 : 1) || String(a.Nombre_Apellido).localeCompare(String(b.Nombre_Apellido), 'es')); }

function renderNav() {
  const n = S.visitas.filter(v => v.Estado_Tarea === 'Pendiente').length;
  $('#nav').innerHTML = NAV.map(([k, l, i]) => `<button class="navb ${S.view === k ? 'on' : ''}" data-nav="${k}">${ico(i)}<span class="flex-1">${l}</span>${k === 'pend' && n ? `<span class="badge bg-red-600 text-white">${n}</span>` : ''}</button>`).join('');

function openDrawer(b) { $('#sidebar').classList.toggle('-translate-x-full', !b); $('#backdrop').classList.toggle('hidden', !b); }

function go(v) {
  S.view = v;
  $$('.view').forEach(x => x.classList.toggle('hidden', x.id !== 'v-' + v));
  $('#title').textContent = TITLES[v];
  renderNav(); openDrawer(false);
  if (v === 'dash') renderDash();
  else if (v === 'asig') buildAsig();
  else if (v === 'pend') buildPend();
  else if (v === 'hist') buildHist();
  else if (v === 'tiendas') buildTiendas();
  else if (v === 'equipo') renderEquipo();
  else if (v === 'logs') loadLogs();
  window.scrollTo(0, 0);
}

function renderCurrent(silent) {
  renderNav();
  if (!$('#modal').classList.contains('hidden')) return;
  switch (S.view) {
    case 'dash': renderDash(); break;
    case 'asig': if (silent) { updateAsigList(); updateAsigPlan(); } else buildAsig(); break;
    case 'pend': if (silent) updatePend(); else buildPend(); break;
    case 'hist': if (silent) updateHist(); else buildHist(); break;
    case 'tiendas': if (silent) loadTiendas(true); else buildTiendas(); break;
    case 'equipo': renderEquipo(); break;
  }
}

 * ===================================================================== */
let DR = [];            // registro de "drill-downs" para los data-di
let CH = {};            // instancias de Chart.js
let CQ = [];            // cola de gráficos por crear
const D = o => (DR.push(o), DR.length - 1);

function destroyCharts() { Object.keys(CH).forEach(k => { try { CH[k].destroy(); } catch (_) {} }); CH = {}; }

function sets() {
  const { desde, hasta } = S.rango, t = S.filtroTec, ok = v => !t || v.Usuario_Asignado === t;
  const inR = s => { const d = dOf(s); return d >= desde && d <= hasta; };
  return {
    res: S.visitas.filter(v => v.Estado_Tarea === 'Resuelta' && ok(v) && inR(v.Fecha_Resolucion)),
    pend: S.visitas.filter(v => v.Estado_Tarea === 'Pendiente' && ok(v)),
    asig: S.visitas.filter(v => ok(v) && inR(v.Fecha_Asignacion))
  };
}

function techsIn(...lists) {
  const m = new Map();
  S.usuarios.filter(u => u.Rol === 'Técnico').forEach(u => m.set(u.Usuario, u));
  lists.forEach(l => l.forEach(v => { if (!m.has(v.Usuario_Asignado)) m.set(v.Usuario_Asignado, U(v.Usuario_Asignado) || { Usuario: v.Usuario_Asignado, Nombre_Apellido: v.Usuario_Asignado, Rol: '' }); }));
  let a = [...m.values()].sort((x, y) => String(x.Nombre_Apellido).localeCompare(String(y.Nombre_Apellido), 'es'));
  if (S.filtroTec) a = a.filter(u => u.Usuario === S.filtroTec);
  return a;
}

// Agrupación temporal de la tendencia: por hora (1 día), por día (≤62 días) o por mes
function bucketMode() {
  const a = new Date(S.rango.desde + 'T00:00:00'), b = new Date(S.rango.hasta + 'T00:00:00');
  const days = Math.round((b - a) / 86400000) + 1;
  return days <= 1 ? 'h' : days <= 62 ? 'd' : 'm';
}
function bucketKey(v) { const m = bucketMode(), s = String(v.Fecha_Resolucion || ''); return m === 'h' ? s.slice(11, 13) : m === 'd' ? s.slice(0, 10) : s.slice(0, 7); }
function bucketLabels(res) {
  const m = bucketMode(), keys = [];
  if (m === 'h') {
    const hs = res.map(v => +bucketKey(v)).filter(n => !isNaN(n));
    const lo = Math.min(7, ...(hs.length ? hs : [7])), hi = Math.max(19, ...(hs.length ? hs : [19]));
    for (let h = lo; h <= hi; h++) keys.push(pad(h));
    return keys.map(k => [k, k + ':00']);
  }
  if (m === 'd') {
    for (let d = new Date(S.rango.desde + 'T00:00:00'), e = new Date(S.rango.hasta + 'T00:00:00'); d <= e; d.setDate(d.getDate() + 1)) keys.push(ymd(d));
    return keys.map(k => [k, k.slice(8) + '/' + k.slice(5, 7)]);
  }
  for (let d = new Date(S.rango.desde.slice(0, 7) + '-01T00:00:00'), e = new Date(S.rango.hasta + 'T00:00:00'); d <= e; d.setMonth(d.getMonth() + 1)) keys.push(ymd(d).slice(0, 7));
  return keys.map(k => [k, k.slice(5) + '/' + k.slice(0, 4)]);
}

/* ---------- Seguimiento de tiendas cerradas ---------- */
const SEGU_KEY = 'vta_seg_umbral';
const tsMs = ts => new Date(String(ts || '').replace(' ', 'T') + '-05:00').getTime();   // Lima: UTC-5 fijo
function segUmbral() { try { const o = JSON.parse(localStorage.getItem(SEGU_KEY)); if (o && o.n > 0 && (o.u === 'h' || o.u === 'd')) return o; } catch (_) {} return { n: 24, u: 'h' }; }
const segUmbralH = () => { const o = segUmbral(); return o.n * (o.u === 'd' ? 24 : 1); };
const segTxt = o => `${o.n} ${o.u === 'd' ? (o.n === 1 ? 'día' : 'días') : (o.n === 1 ? 'hora' : 'horas')}`;
const haceTxt = h => h < 1 ? 'hace minutos' : h < 24 ? `hace ${Math.floor(h)} h` : `hace ${Math.floor(h / 24)} d${Math.floor(h % 24) ? ' ' + Math.floor(h % 24) + ' h' : ''}`;
function segMap() {   // ID de la visita "Tienda Cerrada" -> visita de seguimiento que la actualizó
  const m = {};
  (S.segs || []).forEach(x => { m[x.Seguimiento_De] = x; });   // el servidor envía todos los seguimientos, sin importar el rango de fechas
  return m;
}
// Tiendas que siguen "Tienda Cerrada" desde una visita (lista que envía el servidor, sin importar el rango) y llevan al menos el umbral sin actualizarse.
// Las tiendas Retiradas o eliminadas no vienen en la lista.
function cerradasSinSeg(tec) {
  const ahora = Date.now(), umb = segUmbralH();
  return (S.cerradas || []).filter(c => !tec || c.Usuario === tec)
    .map(c => ({ v: { ID_Cliente: c.ID_Cliente, Nombre_Cliente: c.Nombre_Cliente, Usuario_Asignado: c.Usuario, Fecha_Resolucion: c.Fecha_Estado }, horas: (ahora - tsMs(c.Fecha_Estado)) / 3600000 }))
    .filter(x => x.horas >= umb).sort((a, b) => b.horas - a.horas);
}
function avisoSegHTML() {
  const o = segUmbral(), lst = cerradasSinSeg(S.filtroTec), top = lst.slice(0, 6);
  return `<div class="card p-3.5 mt-3 ${lst.length ? 'border-amber-300 bg-amber-50' : ''}" id="segAviso">
    <div class="flex flex-wrap items-center gap-2">
      <div class="font-semibold text-sm">${lst.length ? '⏰' : '✅'} Tiendas cerradas sin seguimiento</div>
      <span class="badge ${lst.length ? 'bg-amber-200 text-amber-900' : 'bg-green-100 text-green-700'}">${n0(lst.length)}</span>
      <div class="ml-auto flex items-center gap-1.5 text-xs text-slate-600">Avisar desde
        <input id="segN" type="number" min="1" max="999" class="inp !w-16 !py-1" value="${o.n}">
        <select id="segU" class="inp !w-auto !py-1"><option value="h" ${o.u === 'h' ? 'selected' : ''}>horas</option><option value="d" ${o.u === 'd' ? 'selected' : ''}>días</option></select></div></div>
    ${S.cerradas === null ? `<div class="text-xs text-amber-700 mt-1.5">Actualiza <b>Code.gs</b> y publica una nueva versión para activar este aviso.</div>` : lst.length ? `<div class="text-xs text-slate-600 mt-1.5">Su última visita fue <b>Tienda Cerrada</b> y llevan ${esc(segTxt(o))} o más sin actualizarse. Un Supervisor puede hacerlo en la app de campo (<i>“La tienda abrió: actualizar estado”</i>) o programar otra visita.</div>
      <div class="mt-2 divide-y divide-amber-200 text-sm">${top.map(x => `<button class="w-full text-left py-1.5 flex items-center gap-2 hover:bg-amber-100 rounded px-1" data-cssel="${esc(x.v.ID_Cliente)}"><span class="flex-1 min-w-0"><b>${esc(x.v.Nombre_Cliente)}</b> <span class="text-xs text-slate-500">${esc(x.v.ID_Cliente)} · ${esc(nameOf(x.v.Usuario_Asignado))}</span></span><span class="text-xs font-semibold text-amber-800 whitespace-nowrap">${haceTxt(x.horas)}</span></button>`).join('')}</div>
      ${lst.length > top.length ? `<div class="mt-2"><button class="btn btn-outline !py-1.5 !px-3 text-sm" data-tgofilter="cersinseg">Ver las ${n0(lst.length)} en Tiendas →</button></div>` : ''}`
    : `<div class="text-xs text-slate-500 mt-1.5">Ninguna tienda cerrada lleva ${esc(segTxt(o))} o más sin actualizarse.</div>`}</div>`;
}

function applyDrill(list, d) {
  const sm = d.recup || d.sinrec ? segMap() : null;
  return list.filter(v => (!d.recup || sm[v.ID_Visita]) && (!d.sinrec || !sm[v.ID_Visita]) && (!d.tec || v.Usuario_Asignado === d.tec) && (!d.tipo || v.Tipo_Visita === d.tipo) && (!d.status || d.status.includes(v.Status_Tienda)) && (!d.bucket || bucketKey(v) === d.bucket) && (!d.fuera || v.Es_Fuera_De_Ruta === 'SI') && (!d.retiro || d.retiro.includes(v.Retiro_Equipos || '')) && (!d.reinst || d.reinst.includes(v.Reinstalacion_Equipo || '')) && (!d.usb || v.USB_Monitor === 'SI') && (!d.usbret || !!v.Retiro_USB) && (!d.mant || v.Mantenimiento === 'SI'));

    ${kpi('Se reinstaló RB', n0(reR.length), { color: 'text-emerald-500', dot: REI_COLOR['RB'], d: { reinst: ['RB'], label: 'Se reinstaló RB' }, sub: `${n0(okv(reR))} validados · ${n0(reR.length - okv(reR))} sin validar` })}
    ${kpi('USB en monitor', n0(usbN), { color: 'text-indigo-600', dot: REI_COLOR.usb, d: { usb: true, label: 'Visitas con USB dejado en el monitor' }, sub: 'solo en Activa Sin Validación' })}
    ${kpi('USB retirados', n0(usbRetN), { color: 'text-red-600', dot: '#dc2626', d: { usbret: true, label: 'Visitas en que un Supervisor retiró el USB del monitor' }, sub: 'solo lo retira un Supervisor' })}
    ${kpi('Mantenimientos', n0(mantN), { color: 'text-slate-700', dot: REI_COLOR.mant, d: { mant: true, label: 'Visitas con mantenimiento' }, sub: `${pct(mantN, fis)}% de las visitas físicas` })}
  </div>

  <div class="sec">Distribución y tendencia</div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-3">
    <div class="card p-3"><div class="text-sm font-semibold mb-2">Tipo de visita</div><div class="chartbox" style="height:260px"><canvas id="ch-tipo"></canvas></div></div>
    <div class="card p-3"><div class="text-sm font-semibold mb-2">Incidencias</div><div class="chartbox" style="height:260px"><canvas id="ch-inc"></canvas></div></div>
    <div class="card p-3"><div class="text-sm font-semibold mb-2">Visitas ${bucketMode() === 'h' ? 'por hora' : bucketMode() === 'd' ? 'por día' : 'por mes'}</div><div class="chartbox" style="height:260px"><canvas id="ch-trend"></canvas></div></div>
  </div>

  <div class="sec">Desempeño por técnico <span class="normal-case font-normal text-slate-400">· toca una barra para ver el detalle</span></div>
  <div class="grid grid-cols-1 xl:grid-cols-2 gap-3">
    ${techCard('ch-t1', 'Visitas por técnico', techs, res, TIPOS.map(t => ({ label: t, color: COLOR[t], match: v => v.Tipo_Visita === t, drill: { tipo: t } })))}
    ${techCard('ch-t2', 'Visitas activas por técnico', techs, res, ACT.map(s => ({ label: s, color: COLOR[s], match: v => v.Status_Tienda === s, drill: { status: [s] } })))}
    ${techCard('ch-t3', 'Averías por técnico', techs, res, AV.map(s => ({ label: s, color: COLOR[s], match: v => v.Status_Tienda === s, drill: { status: [s] } })))}
    ${techCard('ch-t5', 'Retiro de equipos por técnico (Avería NUC/RB)', techs, res, [RET.nuc, RET.rb].map(k => ({ label: 'Se recogió ' + k, color: RET_COLOR[k], match: v => v.Status_Tienda === 'Avería NUC/RB' && v.Retiro_Equipos === k, drill: { status: ['Avería NUC/RB'], retiro: [k] } })))}
    ${techCard('ch-t6', 'Reinstalación, USB y mantenimiento por técnico', techs, res, [
      { label: 'Reinstaló NUC', color: REI_COLOR['NUC'], match: v => v.Reinstalacion_Equipo === 'NUC', drill: { reinst: ['NUC'] } },
      { label: 'Reinstaló RB', color: REI_COLOR['RB'], match: v => v.Reinstalacion_Equipo === 'RB', drill: { reinst: ['RB'] } },
      { label: 'USB en monitor', color: REI_COLOR.usb, match: v => v.USB_Monitor === 'SI', drill: { usb: true } },
      { label: 'USB retirado', color: '#dc2626', match: v => !!v.Retiro_USB, drill: { usbret: true } },
      { label: 'Mantenimiento', color: REI_COLOR.mant, match: v => v.Mantenimiento === 'SI', drill: { mant: true } }], false)}
    ${techCard('ch-t4', 'Tiendas cerradas y no visitados por técnico', techs, res, [
      { label: 'Tienda Cerrada', color: COLOR['Tienda Cerrada'], match: v => v.Status_Tienda === 'Tienda Cerrada', drill: { status: ['Tienda Cerrada'] } },
      { label: 'No Visitado', color: COLOR['No Visitado'], match: v => v.Tipo_Visita === 'No Visitado', drill: { tipo: 'No Visitado' } }], false)}
  </div>

  <div class="sec">Resumen por técnico</div>
  <div class="card overflow-hidden"><div class="overflow-x-auto">${resumenTable(techs, res, pend, asig)}</div></div>

  <div id="drillBox" class="mt-5"></div>`;

  // Gráficos
  CQ.push({ id: 'ch-tipo', cfg: {
    type: 'doughnut', data: { labels: TIPOS, datasets: [{ data: [fis, rem, nov], backgroundColor: TIPOS.map(col), borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } },
      onClick: (e, els) => { if (els.length) setDrill({ tipo: TIPOS[els[0].index], label: TIPOS[els[0].index] }); }, onHover: hoverPtr },
    plugins: [{ id: 'center', afterDraw(ch) { const a = ch.chartArea; if (!a) return; const x = (a.left + a.right) / 2, y = (a.top + a.bottom) / 2, g = ch.ctx; g.save(); g.textAlign = 'center'; g.fillStyle = '#0f172a'; g.font = '700 26px system-ui'; g.fillText(String(total), x, y + 6); g.fillStyle = '#94a3b8'; g.font = '12px system-ui'; g.fillText('visitas', x, y + 24); g.restore(); } }]
  } });
  CQ.push({ id: 'ch-inc', cfg: {
    type: 'bar', data: { labels: INC, datasets: [{ data: INC.map(s => st[s]), backgroundColor: INC.map(col), borderRadius: 4 }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0 } } },
      onClick: (e, els) => { if (els.length) setDrill({ status: [INC[els[0].index]], label: INC[els[0].index] }); }, onHover: hoverPtr }
  } });
  const bl = bucketLabels(res);
  CQ.push({ id: 'ch-trend', cfg: {
    type: 'bar', data: { labels: bl.map(b => b[1]), datasets: TIPOS.map(t => ({ label: t, backgroundColor: col(t), data: bl.map(b => res.filter(v => v.Tipo_Visita === t && bucketKey(v) === b[0]).length) })) },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } }, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } },
      onClick: (e, els) => { if (els.length) { const el = els[0]; setDrill({ tipo: TIPOS[el.datasetIndex], bucket: bl[el.index][0], label: `${TIPOS[el.datasetIndex]} · ${bl[el.index][1]}` }); } }, onHover: hoverPtr }
  } });
  buildCharts();
  renderDrill(false);
}

const hoverPtr = (e, els) => { if (e && e.native && e.native.target) e.native.target.style.cursor = els.length ? 'pointer' : 'default'; };

function techCard(id, title, techs, res, series, stacked = true) {
  const h = Math.max(190, techs.length * 40 + 90);
  if (!techs.length) return `<div class="card p-3"><div class="text-sm font-semibold mb-2">${title}</div><div class="text-sm text-slate-400 p-6 text-center">Sin técnicos</div></div>`;
  CQ.push({ id, cfg: {
    type: 'bar',
    data: { labels: techs.map(shortName), datasets: series.map(s => ({ label: s.label, backgroundColor: s.color, borderRadius: 3, data: techs.map(t => res.filter(v => v.Usuario_Asignado === t.Usuario && s.match(v)).length) })) },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } },
      scales: { x: { stacked, beginAtZero: true, ticks: { precision: 0 } }, y: { stacked } },
      onClick: (e, els) => { if (!els.length) return; const el = els[0], s = series[el.datasetIndex], t = techs[el.index]; setDrill({ ...s.drill, tec: t.Usuario, label: `${s.label} · ${shortName(t)}` }); }, onHover: hoverPtr }
  } });
  return `<div class="card p-3"><div class="text-sm font-semibold mb-2">${title}</div><div class="chartbox" style="height:${h}px"><canvas id="${id}"></canvas></div></div>`;
}

function buildCharts() {
  CQ.forEach(q => {
    const cv = document.getElementById(q.id); if (!cv) return;
    if (typeof Chart === 'undefined') { cv.parentElement.innerHTML = '<div class="text-sm text-slate-500 p-4">No se pudo cargar la librería de gráficos. Revisa tu conexión.</div>'; return; }
    try { CH[q.id] = new Chart(cv, q.cfg); } catch (e) { cv.parentElement.innerHTML = '<div class="text-sm text-red-600 p-4">Error al dibujar el gráfico.</div>'; }
  });
  CQ = [];
}

function resumenTable(techs, res, pend, asig) {
  const rows = techs.map(t => {
    const r = res.filter(v => v.Usuario_Asignado === t.Usuario), p = pend.filter(v => v.Usuario_Asignado === t.Usuario), a = asig.filter(v => v.Usuario_Asignado === t.Usuario);
    const f = x => r.filter(x).length;
    return { t, a: a.length, r: r.length, p: p.length, fis: f(v => v.Tipo_Visita === 'Visita Física'), rem: f(v => v.Tipo_Visita === 'Visita Remota'), nov: f(v => v.Tipo_Visita === 'No Visitado'),
      act: f(v => ACT.includes(v.Status_Tienda)), ave: f(v => AV.includes(v.Status_Tienda)), cer: f(v => v.Status_Tienda === 'Tienda Cerrada') };
  }).sort((x, y) => y.r - x.r);
  const sum = k => rows.reduce((a, r) => a + r[k], 0);
  if (!rows.length) return '<div class="p-6 text-center text-sm text-slate-400">Sin técnicos</div>';
  return `<table class="t"><thead><tr><th>Técnico</th><th>Asignadas</th><th>Resueltas</th><th>Pendientes</th><th>Físicas</th><th>Remotas</th><th>No visit.</th><th>Activas</th><th>Averías</th><th>Cerradas</th><th>Avance</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="clk" data-di="${D({ tec: r.t.Usuario, label: 'Visitas de ' + shortName(r.t) })}"><td class="font-medium whitespace-nowrap">${esc(r.t.Nombre_Apellido)}</td><td>${r.a}</td><td><b>${r.r}</b></td><td>${r.p}</td><td>${r.fis}</td><td>${r.rem}</td><td>${r.nov}</td><td class="text-green-700">${r.act}</td><td class="text-red-700">${r.ave}</td><td>${r.cer}</td><td>${pct(r.r, r.r + r.p)}%</td></tr>`).join('')}
    <tr class="bg-slate-50 font-semibold"><td>Total</td><td>${sum('a')}</td><td>${sum('r')}</td><td>${sum('p')}</td><td>${sum('fis')}</td><td>${sum('rem')}</td><td>${sum('nov')}</td><td>${sum('act')}</td><td>${sum('ave')}</td><td>${sum('cer')}</td><td>${pct(sum('r'), sum('r') + sum('p'))}%</td></tr></tbody></table>`;
}

function setDrill(d) {
  if (d.asigRango) { toast('Esta tarjeta es informativa. Usa el Historial para ver las visitas por fecha.', 'info'); return; }
  S.drill = d; S.drillPage = 1; renderDrill(true);
}
function renderDrill(scroll) {
  const box = $('#drillBox'); if (!box) return;
  if (!S.drill) { box.innerHTML = '<div class="text-center text-sm text-slate-400 py-6">Toca una tarjeta, un gráfico o una fila para ver el detalle de las visitas.</div>'; return; }
  const { res } = sets(), d = S.drill;
  S.drillList = applyDrill(res, d).sort((a, b) => String(b.Fecha_Resolucion).localeCompare(String(a.Fecha_Resolucion)));
  box.innerHTML = `<div class="card overflow-hidden"><div class="p-3 flex flex-wrap items-center gap-2 border-b border-slate-100">
      <div class="font-semibold">Detalle: ${esc(d.label || 'Visitas')}</div><span class="badge bg-blue-100 text-blue-700">${n0(S.drillList.length)} visitas</span>
      ${d.tec ? `<span class="badge bg-slate-100 text-slate-700">${esc(nameOf(d.tec))}</span>` : ''}
      <div class="ml-auto flex gap-2"><button class="btn btn-outline !py-1.5" data-csv="drill">Exportar CSV</button><button class="btn btn-ghost !py-1.5" data-drillclear>Limpiar</button></div></div>
    ${tableHTML(S.drillList, S.drillPage, 'drill')}</div>`;
  if (scroll) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- Tabla de visitas resueltas (detalle e historial) ---------- */
function tipoBadge(t) { const c = col(t); return `<span class="badge" style="background:${c}1a;color:${c}">${esc(t || '—')}</span>`; }
function tableHTML(list, page, key) {
  if (!list.length) return '<div class="p-8 text-center text-sm text-slate-500">Sin visitas para mostrar.</div>';
  const rows = list.slice(0, page * CONFIG.PAGE);
  return `<div class="overflow-x-auto"><table class="t"><thead><tr><th>Resolución</th><th>Técnico</th><th>Tienda</th><th>Tipo</th><th>Status</th><th>Dist.</th><th>Fotos</th><th>Observación</th></tr></thead><tbody>
    ${rows.map(v => `<tr><td class="whitespace-nowrap">${fmtDT(v.Fecha_Resolucion)}</td>
      <td>${esc(nameOf(v.Usuario_Asignado))}${v.Es_Fuera_De_Ruta === 'SI' ? ' <span class="badge bg-amber-100 text-amber-700">Fuera de ruta</span>' : ''}${v.Seguimiento_De ? ' <span class="badge bg-sky-100 text-sky-700" title="Actualiza la visita ' + esc(v.Seguimiento_De) + ' (tienda cerrada)">Seguimiento</span>' : ''}</td>
      <td><b>${esc(v.Nombre_Cliente)}</b><div class="text-xs text-slate-400">${esc(v.ID_Cliente)}</div></td>
      <td>${tipoBadge(v.Tipo_Visita)}</td>
      <td><span class="badge" style="background:${col(v.Status_Tienda)}1a;color:${col(v.Status_Tienda)}">${esc(v.Status_Tienda || '—')}</span>${v.Retiro_Equipos ? `<div class="mt-1"><span class="badge" style="background:#ffedd5;color:#c2410c">📦 ${esc(v.Retiro_Equipos)}</span></div>` : ''}${v.Reinstalacion_Equipo ? `<div class="mt-1"><span class="badge" style="background:#d1fae5;color:#047857">🔁 Reinstaló ${esc(v.Reinstalacion_Equipo)}</span></div>` : ''}${v.USB_Monitor === 'SI' ? `<div class="mt-1"><span class="badge" style="background:#e0e7ff;color:#4338ca">💾 USB</span></div>` : ''}${v.Mantenimiento === 'SI' ? `<div class="mt-1"><span class="badge" style="background:#e2e8f0;color:#334155">🛠️ Mantenimiento</span></div>` : ''}</td>
      <td class="whitespace-nowrap">${isNum(v.Distancia_Metros) ? Math.round(v.Distancia_Metros) + ' m' : '—'}</td>
      <td class="whitespace-nowrap">${v.URL_Foto_Fachada ? `<a class="text-blue-600" target="_blank" rel="noopener" href="${esc(v.URL_Foto_Fachada)}">Fachada</a>` : ''} ${v.URL_Foto_Monitor ? `<a class="text-blue-600" target="_blank" rel="noopener" href="${esc(v.URL_Foto_Monitor)}">Monitor</a>` : ''}${!v.URL_Foto_Fachada && !v.URL_Foto_Monitor ? '—' : ''}</td>
      <td class="min-w-[160px] max-w-[320px] text-slate-600">${esc(v.Observacion)}</td></tr>`).join('')}</tbody></table></div>
    ${list.length > rows.length ? `<div class="p-3 text-center"><button class="btn btn-ghost" data-more="${key}">Mostrar más (${n0(list.length - rows.length)})</button></div>` : ''}`;
}

function exportCSV(list, name) {
  const q = (v) => { if (v === null || v === undefined) return '""'; let s = String(v); if (typeof v !== 'number' && /^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const csv = [VCOLS.join(',')].concat(list.map(v => VCOLS.map(c => q(v[c])).join(','))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* =====================================================================
 *  HISTORIAL
 * ===================================================================== */
function buildHist() {
  const h = S.hist;
  $('#v-hist').innerHTML = `${filterBar()}
    <div class="card p-3 mt-3 flex flex-wrap gap-2 items-center">
      <input id="hQ" type="search" class="inp flex-1 min-w-[180px]" placeholder="Buscar tienda, ID, técnico u observación" value="${esc(h.q)}">
      <select id="hTipo" class="inp !w-auto"><option value="">Todos los tipos</option>${TIPOS.map(t => `<option ${h.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <select id="hStatus" class="inp !w-auto"><option value="">Todos los status</option>${INC.map(t => `<option ${h.status === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <label class="flex items-center gap-2 text-sm"><input id="hFuera" type="checkbox" ${h.fuera ? 'checked' : ''}> Solo fuera de ruta</label>
      <button class="btn btn-outline" data-csv="hist">Exportar CSV</button>
    </div>
    <div class="text-xs text-slate-500 mt-2" id="hCount"></div>
    <div class="card mt-1 overflow-hidden" id="hList"></div>`;
  updateHist();
}
function updateHist() {
  const h = S.hist, { res } = sets(), q = norm(h.q.trim());
  const list = res.filter(v => (!h.tipo || v.Tipo_Visita === h.tipo) && (!h.status || v.Status_Tienda === h.status) && (!h.fuera || v.Es_Fuera_De_Ruta === 'SI')
    && (!q || norm(v.Nombre_Cliente).includes(q) || norm(v.ID_Cliente).includes(q) || norm(nameOf(v.Usuario_Asignado)).includes(q) || norm(v.Observacion).includes(q)))
    .sort((a, b) => String(b.Fecha_Resolucion).localeCompare(String(a.Fecha_Resolucion)));
  S.histList = list;
  const c = $('#hCount'), l = $('#hList'); if (!c || !l) return;
  c.textContent = `${n0(list.length)} visitas resueltas · ${rangeLabel()}`;
  l.innerHTML = tableHTML(list, h.page, 'hist');
}

/* =====================================================================
 *  VISITAS PENDIENTES (gestión masiva)
 * ===================================================================== */
function buildPend() {
  const p = S.pend;
  $('#v-pend').innerHTML = `
    <div class="card p-3 flex flex-wrap gap-2 items-center">
      <input id="pQ" type="search" class="inp flex-1 min-w-[200px]" placeholder="Buscar por tienda, ID o técnico" value="${esc(p.q)}">
      <select id="pTec" class="inp !w-auto"><option value="">Todos los técnicos</option>${orderedUsers().map(u => `<option value="${esc(u.Usuario)}" ${p.tec === u.Usuario ? 'selected' : ''}>${esc(u.Nombre_Apellido)}</option>`).join('')}</select>
      <label class="flex items-center gap-2 text-sm"><input id="pAtr" type="checkbox" ${p.soloAtras ? 'checked' : ''}> Solo de días anteriores</label>
    </div>
    <div id="pChips" class="flex flex-wrap gap-1.5 mt-3"></div>
    <div class="card mt-3 overflow-hidden">
      <label class="flex items-center gap-3 p-3 border-b border-slate-100 cursor-pointer text-sm font-medium"><input id="pAll" type="checkbox"><span id="pCount"></span></label>
      <div id="pList"></div>
    </div>
    <div id="pBar" class="sticky bottom-3 mt-3 z-10"></div>`;
  updatePend();
}
function pendFiltered() {
  const p = S.pend, q = norm(p.q.trim()), hoy = ymd(new Date());
  return S.visitas.filter(v => v.Estado_Tarea === 'Pendiente' && (!p.tec || v.Usuario_Asignado === p.tec) && (!p.soloAtras || dOf(v.Fecha_Asignacion) < hoy)
    && (!q || norm(v.Nombre_Cliente).includes(q) || norm(v.ID_Cliente).includes(q) || norm(nameOf(v.Usuario_Asignado)).includes(q)))
    .sort((a, b) => String(a.Fecha_Asignacion).localeCompare(String(b.Fecha_Asignacion)));
}
function daysAgo(s) { const d = dOf(s); if (!d) return 0; return Math.max(0, Math.round((new Date(ymd(new Date()) + 'T00:00:00') - new Date(d + 'T00:00:00')) / 86400000)); }
function updatePend() {
  const p = S.pend, list = pendFiltered(); S.pendList = list;
  const all = S.visitas.filter(v => v.Estado_Tarea === 'Pendiente');
  const chips = orderedUsers().filter(u => u.Rol === 'Técnico' || all.some(v => v.Usuario_Asignado === u.Usuario)).map(u => {
    const n = all.filter(v => v.Usuario_Asignado === u.Usuario).length;
    return `<button class="chip ${p.tec === u.Usuario ? 'chip-on' : ''}" data-pchip="${esc(u.Usuario)}">${esc(shortName(u))}: ${n}</button>`;
  }).join('');
  const ch = $('#pChips'), pl = $('#pList'); if (!ch || !pl) return;
  ch.innerHTML = chips;
  const rows = list.slice(0, p.page * CONFIG.PAGE);
  pl.innerHTML = rows.length ? rows.map(v => { const d = daysAgo(v.Fecha_Asignacion);
    return `<label class="row"><input type="checkbox" data-pid="${esc(v.ID_Visita)}" ${p.sel.has(v.ID_Visita) ? 'checked' : ''}>
      <div class="min-w-0 flex-1"><div class="font-medium truncate">${esc(v.Nombre_Cliente)}</div><div class="text-xs text-slate-400">${esc(v.ID_Cliente)} · asignada ${fmtDT(v.Fecha_Asignacion)}</div></div>
      <div class="text-right"><div class="text-sm">${esc(shortName(U(v.Usuario_Asignado) || { Usuario: v.Usuario_Asignado }))}</div>${d > 0 ? `<span class="badge bg-amber-100 text-amber-700">hace ${d} d</span>` : '<span class="badge bg-blue-100 text-blue-700">hoy</span>'}</div></label>`; }).join('')
      + (list.length > rows.length ? `<div class="p-3 text-center"><button class="btn btn-ghost" data-more="pend">Mostrar más (${n0(list.length - rows.length)})</button></div>` : '')
    : '<div class="p-8 text-center text-sm text-slate-500">No hay visitas pendientes con ese filtro 🎉</div>';
  updatePendBar();
}
function updatePendBar() {
  const p = S.pend, list = S.pendList || [], n = p.sel.size;
  const allOn = list.length && list.every(v => p.sel.has(v.ID_Visita));

// Algoritmo de "zonas": recorre las tiendas por vecino más cercano y corta la ruta en tramos consecutivos
function ordenZonas(ids) {
  const pts = ids.map(id => S.clientMap[id]);
  const ok = c => isNum(c.Latitud) && isNum(c.Longitud);
  const con = pts.filter(ok), sin = pts.filter(c => !ok(c));
  if (!con.length) return pts.map(c => c.ID_Cliente);
  const kx = Math.cos(con[0].Latitud * Math.PI / 180), rest = con.slice();
  let cur = rest.reduce((m, c) => c.Longitud < m.Longitud ? c : m); rest.splice(rest.indexOf(cur), 1);
  const out = [cur];
  while (rest.length) {
    let bi = 0, bd = Infinity;
    for (let i = 0; i < rest.length; i++) { const dx = (rest[i].Longitud - cur.Longitud) * kx, dy = rest[i].Latitud - cur.Latitud, d = dx * dx + dy * dy; if (d < bd) { bd = d; bi = i; } }
    cur = rest.splice(bi, 1)[0]; out.push(cur);
  }
  return out.concat(sin).map(c => c.ID_Cliente);
}

function planAsig() {
  const a = S.asig;
  let ids = [...a.sel].filter(id => S.clientMap[id]);
  const total = ids.length; let omit = 0;
  if (a.omitir) { const f = ids.filter(id => !(S.pendByClient[id] || []).length); omit = ids.length - f.length; ids = f; }
  ids.sort((x, y) => String(S.clientMap[x].Nombre_Cliente).localeCompare(String(S.clientMap[y].Nombre_Cliente), 'es'));
  const tecs = a.modo === 'uno' ? (a.destino ? [a.destino] : []) : orderedUsers().filter(u => a.tecs.has(u.Usuario)).map(u => u.Usuario);
  const items = [];
  if (tecs.length && ids.length) {
    if (a.modo === 'uno') ids.forEach(id => items.push({ idCliente: id, usuario: tecs[0] }));
    else if (a.modo === 'turnos') ids.forEach((id, i) => items.push({ idCliente: id, usuario: tecs[i % tecs.length] }));
    else if (a.modo === 'zonas') {
      const ord = ordenZonas(ids), n = ord.length, k = tecs.length, base = Math.floor(n / k), extra = n % k; let p = 0;
      tecs.forEach((t, i) => { const sz = base + (i < extra ? 1 : 0); for (let j = 0; j < sz; j++) items.push({ idCliente: ord[p++], usuario: t }); });
    } else {
      const load = {}; tecs.forEach(t => { load[t] = pendCount(t); });
      ids.forEach(id => { let b = tecs[0]; tecs.forEach(t => { if (load[t] < load[b]) b = t; }); load[b]++; items.push({ idCliente: id, usuario: b }); });
    }
  }
  const per = {}; items.forEach(i => { per[i.usuario] = (per[i.usuario] || 0) + 1; });
  return { items, per, total, omit, tecs, efectivas: ids.length };
}

  sinestado: t => !t.Estado_Tienda,
  pend: t => actv(t) && !!t.Equipo_Pendiente_Reinstalar,
  sinval: t => actv(t) && t.Estado_Equipo === 'Instalado sin validar',
  usb: t => t.Tiene_USB === 'SI',
  usbret: t => t.USB_Por_Retirar === 'SI',
  nuc: t => t.Componente_Actual === 'NUC',
  rb: t => t.Componente_Actual === 'RB',
  sineq: t => actv(t) && !t.Componente_Actual && !t.Equipo_Pendiente_Reinstalar && !t.Origen_Equipo,
  sinvisita: t => actv(t) && !t.Total_Visitas,
  atras: t => { if (!actv(t)) return false; const d = diasDesde(t.Ultima_Visita); return d === null || d > 30; },
  sinmant: t => actv(t) && !t.Ultimo_Mantenimiento,
  sincontacto: t => actv(t) && !t.Contacto_1,
  sindistrito: t => actv(t) && !t.Distrito
};
const compTxt = t => t.Componente_Actual || (t.Equipo_Pendiente_Reinstalar ? 'Sin equipo (retirado)' : t.Origen_Equipo ? 'Ninguno' : 'Sin dato');
const diasCol = d => d === null ? 'text-slate-400' : d > 30 ? 'text-red-600' : d > 14 ? 'text-amber-600' : 'text-green-600';
const diasTxt = d => d === null ? 'sin visitas' : d === 0 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} días`;
const fmtTel = s => { s = String(s || ''); return s.length === 9 ? s.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3') : s; };
const telLink = s => !s ? '' : `<a class="text-blue-600" href="tel:+51${esc(s)}">${esc(fmtTel(s))}</a>${/^9\d{8}$/.test(s) ? ` <a class="text-green-600 text-xs font-semibold" target="_blank" rel="noopener" href="https://wa.me/51${esc(s)}">WhatsApp</a>` : ''}`;
const tBadges = t => t.Estado_Tienda === 'Retirado' ? '' : [
  t.Equipo_Pendiente_Reinstalar ? `<span class="badge bg-amber-100 text-amber-800">⚠ Reinstalar ${esc(t.Equipo_Pendiente_Reinstalar)}</span>` : '',
  t.Estado_Equipo === 'Instalado sin validar' ? '<span class="badge bg-orange-100 text-orange-700">🔧 Sin validar</span>' : '',
  t.USB_Por_Retirar === 'SI' ? '<span class="badge bg-red-100 text-red-700">💾 USB por retirar</span>' : (t.Tiene_USB === 'SI' ? '<span class="badge bg-indigo-100 text-indigo-700">💾 USB</span>' : '')
].join(' ');

async function loadTiendas(silent) {
  try {
    const d = await api('getTiendas');
    S.tienda.data = d.tiendas || []; S.tienda.hoja = d.hojaTiendas !== false; S.tienda.setup = !!d.faltaSetup;
    if (S.view === 'tiendas' && $('#tList') && $('#modal').classList.contains('hidden')) updateTiendas();
    else if (S.view === 'tiendas' && $('#tList')) updateTiendas(true);
  } catch (e) { if (!silent && e.code !== 'AUTH') toast(e.message, 'error'); }
}

function tiendaFiltrada() {
  refreshCSS();
  const T = S.tienda, q = norm(T.q.trim()), qd = T.q.replace(/\D/g, '');
  return (T.data || []).filter(t => TPRED[T.filtro](t) && (!T.distrito || t.Distrito === T.distrito)
      && (!q || norm(t.Nombre_Cliente).includes(q) || norm(t.ID_Cliente).includes(q) || norm(nameOf(t.Ultimo_Tecnico)).includes(q) || norm(t.Ultima_Observacion).includes(q)
        || norm(t.Distrito).includes(q) || norm(t.Direccion).includes(q) || (qd.length >= 4 && ((t.Contacto_1 || '').includes(qd) || (t.Contacto_2 || '').includes(qd)))))
    .sort((a, b) => T.filtro === 'ret90' ? String(a.Retirada_Fecha).localeCompare(String(b.Retirada_Fecha)) : T.filtro === 'cersinseg' ? String(a.Fecha_Estado).localeCompare(String(b.Fecha_Estado)) : String(a.Nombre_Cliente).localeCompare(String(b.Nombre_Cliente), 'es'));
}
function refreshDistritos() {
  const sel = $('#tDist'); if (!sel) return;
  const cnt = {}; (S.tienda.data || []).forEach(t => { if (t.Distrito) cnt[t.Distrito] = (cnt[t.Distrito] || 0) + 1; });
  const ks = Object.keys(cnt).sort((a, b) => a.localeCompare(b, 'es'));
  sel.innerHTML = '<option value="">Todos los distritos</option>' + ks.map(k => `<option value="${esc(k)}" ${S.tienda.distrito === k ? 'selected' : ''}>${esc(k)} (${cnt[k]})</option>`).join('');
}

function updateTiendas(soloLista) {
  const T = S.tienda; if (!$('#tList')) return;
  refreshCSS();
  const data = T.data || [];
  $('#tWarn').innerHTML = !T.hoja ? '<div class="card p-3 mb-3 text-sm bg-amber-50 border-amber-200 text-amber-900">La hoja <b>Tiendas</b> todavía no existe en tu Google Sheet. Ejecuta <b>setupSheet</b> en Apps Script una vez; mientras tanto solo se muestra la lista de clientes sin datos de visitas.</div>'
    : T.setup ? '<div class="card p-3 mb-3 text-sm bg-amber-50 border-amber-200 text-amber-900">Faltan columnas nuevas en tu Google Sheet (estado, distrito, contactos, USB, retiros). Ejecuta <b>setupSheet</b> en Apps Script una vez para activarlas: no se pierde ningún dato.</div>' : '';
  if (T.filtro === 'ret90') $('#tWarn').innerHTML += `<div class="card p-3 mb-3 text-sm bg-slate-50">Tiendas <b>Retiradas hace más de ${RETIRADA_DIAS} días</b>, de la más antigua a la más reciente. Si ya no las necesitas, selecciónalas con la casilla del encabezado y usa <b>🗑 Eliminar</b> para limpiar la base (sus visitas resueltas se conservan en el historial). Si quieres respaldo, exporta antes con ⬇ Excel.</div>`;
  if (T.filtro === 'cersinseg') $('#tWarn').innerHTML += `<div class="card p-3 mb-3 text-sm bg-amber-50 border-amber-200 text-amber-900">Tiendas cuya última visita fue <b>Tienda Cerrada</b> y llevan <b>${esc(segTxt(segUmbral()))}</b> o más sin actualizarse (el umbral se cambia en el aviso del Dashboard). Ordenadas de la más antigua a la más reciente.</div>`;
  refreshDistritos();
  const chips = [['', 'Total tiendas'], ['enlinea', 'En Línea'], ['pendiente', 'Pendiente'], ['averia', 'Avería'], ['cerrada', 'Tienda Cerrada'], ['cersinseg', 'Cerradas sin seguimiento'], ['solret', 'Solicitud de Retiro'], ['retirado', 'Retirado'], ['ret90', `Retiradas +${RETIRADA_DIAS} días`], ['sinvisita', 'Sin visitas'], ['atras', '+30 días sin visita'],
    ['nuc', 'Con NUC'], ['rb', 'Con RB'], ['sineq', 'Equipo sin dato'], ['pend', 'Pend. reinstalar'], ['sinval', 'Sin validar'], ['usb', 'Con USB'], ['usbret', 'USB por retirar']];
  const chipCol = { enlinea: 'text-green-600', pendiente: 'text-amber-600', averia: 'text-red-600', cerrada: 'text-slate-600', solret: 'text-violet-700', retirado: 'text-slate-500', ret90: 'text-red-600', cersinseg: 'text-amber-600', pend: 'text-amber-600', usb: 'text-indigo-600', usbret: 'text-red-600' };
  $('#tChips').innerHTML = chips.map(([k, l]) => `<button data-tchip="${k}" class="card kpi !p-2.5 ${T.filtro === k ? 'ring-2 ring-blue-500' : ''}"><div class="text-[11px] font-semibold text-slate-500 leading-tight">${l}</div><div class="text-2xl font-bold ${chipCol[k] || 'text-slate-800'}">${n0(data.filter(TPRED[k]).length)}</div></button>`).join('');
  const list = tiendaFiltrada();
  S.tiendaList = list;
  $('#tCount').textContent = `${n0(list.length)} de ${n0(data.length)} tiendas`;
  const rows = list.slice(0, T.page * CONFIG.PAGE);
  $('#tList').innerHTML = !list.length ? '<div class="p-8 text-center text-sm text-slate-500">No hay tiendas para mostrar.</div>' :
    `<div class="overflow-x-auto"><table class="t"><thead><tr><th class="!w-8" data-tcell><input type="checkbox" data-tckall title="Seleccionar todas las tiendas de la lista (${n0(list.length)})" ${list.length && list.every(t => T.chk.has(t.ID_Cliente)) ? 'checked' : ''}></th><th>Tienda</th><th>Última visita</th><th>Técnico</th><th>Estado</th><th>Equipo</th></tr></thead><tbody>
    ${rows.map(t => { const d = diasDesde(t.Ultima_Visita); return `<tr class="clk ${T.sel === t.ID_Cliente ? 'bg-blue-50' : ''} ${t.Estado_Tienda === 'Retirado' ? 'opacity-60' : ''}" data-tsel="${esc(t.ID_Cliente)}">
      <td data-tcell><input type="checkbox" data-tck="${esc(t.ID_Cliente)}" ${T.chk.has(t.ID_Cliente) ? 'checked' : ''}></td>
      <td><b>${esc(t.Nombre_Cliente)}</b><div class="text-xs text-slate-400">${esc(t.ID_Cliente)}${t.Distrito ? ' · ' + esc(t.Distrito) : ''}</div></td>
      <td class="whitespace-nowrap">${t.Ultima_Visita ? fmtD(t.Ultima_Visita) : '—'}<div class="text-xs ${diasCol(d)}">${diasTxt(d)}</div></td>
      <td>${t.Ultimo_Tecnico ? esc(nameOf(t.Ultimo_Tecnico)) : '—'}</td>
      <td>${estadoBadge(t)}${t.Estado_Tienda === 'Avería' && /^Avería/.test(t.Ultimo_Status || '') ? `<div class="text-[11px] text-slate-500 mt-0.5">${esc(t.Ultimo_Status)}</div>` : ''}${t.Estado_Tienda && t.Origen_Estado === 'Importado' ? '<div class="text-[10px] text-slate-400 mt-0.5">base anterior</div>' : ''}${t.Estado_Tienda === 'Retirado' && t.Retirada_Fecha ? `<div class="text-[10px] text-slate-400 mt-0.5">desde ${fmtD(t.Retirada_Fecha)} · ${diasTxt(diasDesde(t.Retirada_Fecha))}</div>` : ''}${t.Estado_Tienda === 'Tienda Cerrada' && CSS.has(t.ID_Cliente) ? '<div class="text-[10px] text-amber-700 font-semibold mt-0.5">⏰ sin seguimiento</div>' : ''}</td>
      <td><b>${esc(compTxt(t))}</b><div class="flex flex-wrap gap-1 mt-0.5">${tBadges(t)}</div></td></tr>`; }).join('')}</tbody></table></div>
    ${list.length > rows.length ? `<div class="p-3 text-center"><button class="btn btn-ghost" data-more="tienda">Mostrar más (${n0(list.length - rows.length)})</button></div>` : ''}`;
  renderSelBar();
  if (!soloLista) renderTiendaDetail();
}

const TWIDE = () => matchMedia('(min-width: 1024px)').matches;
function selTienda(id) {
  S.tienda.sel = id; updateTiendas(true);
  const t = (S.tienda.data || []).find(x => x.ID_Cliente === id); if (!t) return;
  if (TWIDE()) renderTiendaDetail(); else { openModal(`<div class="p-4">${tiendaDetailHTML(t, true)}</div>`); ensureHist(id); }
}
function renderTiendaDetail() {
  const box = $('#tDetailBox'); if (!box || !TWIDE()) return;

  box.innerHTML = t ? tiendaDetailHTML(t, false) : '<div class="card p-8 text-center text-sm text-slate-400">Selecciona una tienda de la lista para ver su información actualizada.</div>';

}

  const maps = isNum(t.Latitud) && isNum(t.Longitud) ? `https://www.google.com/maps?q=${t.Latitud},${t.Longitud}` : '';

    <div class="flex flex-wrap gap-1 mt-2">${t.Estado_Tienda === 'Retirado' ? '' : (tBadges(t) || '<span class="text-xs text-slate-400">Sin alertas de equipos</span>')}</div>

  openModal(`<div class="p-5 space-y-3">

    ${camposTiendaHTML({})}
    <div class="text-xs text-slate-500 bg-slate-50 rounded-lg p-2">Obligatorios: <b>ID, nombre y coordenadas</b> (la app del técnico las usa para validar que está a 100 m de la tienda). El resto lo puedes completar después con ✏️ Editar.</div>

  bindPegar();
  $('#btnTNew').addEventListener('click', async () => {
    const er = $('#eErr'); er.classList.add('hidden');

// "-12.04, -77.09" → { lat, lng }. Repara el punto decimal perdido ("-11994298" → -11.994298). null si no hay dos números.
function fixCoord(x) {
  x = String(x).replace(',', '.').trim();
  if (/^-?\d+\.\d+$/.test(x)) return { v: parseFloat(x), rep: false };
  const m = /^(-?)(\d{2})(\d{3,})$/.exec(x);
  return m ? { v: parseFloat(`${m[1]}${m[2]}.${m[3]}`), rep: true } : (/^-?\d{1,2}$/.test(x) ? { v: parseFloat(x), rep: false } : null);
}
function parseUbic(s) {

  const a = fixCoord(m[0]), b = fixCoord(m[1]);
  return a && b ? { lat: a.v, lng: b.v, rep: a.rep || b.rep } : null;
}

  $('#nav').addEventListener('click', e => { const b = e.target.closest('[data-nav]'); if (b) go(b.dataset.nav); });
  $('#modal').addEventListener('click', e => {
    const ed = e.target.closest('[data-tedit]'); if (ed) return openEditTienda(ed.dataset.tedit);   // “Editar” dentro del detalle abierto como ventana (celular)
    const rt = e.target.closest('[data-tret]'); if (rt) return accionTiendas('retirar', [rt.dataset.tret]);
    const dl = e.target.closest('[data-tdel]'); if (dl) return accionTiendas('eliminar', [dl.dataset.tdel]);
    const ta = e.target.closest('[data-tact][data-tid]'); if (ta) return accionTiendas(ta.dataset.tact, [ta.dataset.tid]);
    if (e.target.closest('[data-close]') || e.target === $('#modal')) closeModal();
  });

  const root = $('#content');
  root.addEventListener('click', async e => {
    const t = e.target;
    let el;
    if ((el = t.closest('[data-preset]'))) {
      const k = el.dataset.preset;
      if (k === 'custom') { S.rango.preset = 'custom'; renderCurrent(false); return; }
      setPreset(k); S.drill = null; return loadData(false);
    }
    if ((el = t.closest('.rg-apply'))) {
      const bar = el.closest('.fbar'), d = $('.rg-desde', bar).value, h = $('.rg-hasta', bar).value;
      if (!d || !h || d > h) return toast('Revisa el rango de fechas', 'warn');
      S.rango = { preset: 'custom', desde: d, hasta: h }; S.drill = null; return loadData(false);
    }
    if ((el = t.closest('[data-di]'))) { const d = DR[+el.dataset.di]; if (d) setDrill(d); return; }
    if ((el = t.closest('[data-cssel]'))) { S.tienda.sel = el.dataset.cssel; S.tienda.filtro = 'cersinseg'; S.tienda.page = 1; return go('tiendas'); }
    if ((el = t.closest('[data-tgofilter]'))) { S.tienda.filtro = el.dataset.tgofilter; S.tienda.page = 1; return go('tiendas'); }
    if ((el = t.closest('[data-go]'))) { if (el.dataset.go === 'pend') S.pend.tec = S.filtroTec; return go(el.dataset.go); }
    if (t.closest('[data-drillclear]')) { S.drill = null; renderDrill(false); return; }
    if ((el = t.closest('[data-csv]'))) {
      const k = el.dataset.csv, list = k === 'drill' ? S.drillList : S.histList;
      if (!list || !list.length) return toast('No hay datos para exportar', 'warn');
      return exportCSV(list, `visitas_${S.rango.desde}_${S.rango.hasta}.csv`);
    }
    if ((el = t.closest('[data-more]'))) {
      const k = el.dataset.more;
      if (k === 'drill') { S.drillPage++; renderDrill(false); } else if (k === 'hist') { S.hist.page++; updateHist(); }
      else if (k === 'tienda') { S.tienda.page++; updateTiendas(true); }
      else if (k === 'pend') { S.pend.page++; updatePend(); } else if (k === 'asig') { S.asig.page++; updateAsigList(); }
      return;
    }
    if ((el = t.closest('[data-tck]'))) { const T = S.tienda; if (el.checked) T.chk.add(el.dataset.tck); else T.chk.delete(el.dataset.tck); return updateTiendas(true); }
    if ((el = t.closest('[data-tckall]'))) { const T = S.tienda; (S.tiendaList || []).forEach(x => { if (el.checked) T.chk.add(x.ID_Cliente); else T.chk.delete(x.ID_Cliente); }); return updateTiendas(true); }
    if (t.closest('[data-tcell]')) return;      // clic junto a la casilla: no abre el detalle
    if ((el = t.closest('[data-tact]:not([data-tid])'))) { const T = S.tienda, k = el.dataset.tact; if (k === 'limpiar') { T.chk.clear(); return updateTiendas(true); } return accionTiendas(k, [...T.chk]); }
    if ((el = t.closest('[data-tret]'))) return accionTiendas('retirar', [el.dataset.tret]);
    if ((el = t.closest('[data-tdel]'))) return accionTiendas('eliminar', [el.dataset.tdel]);
    if ((el = t.closest('[data-tact][data-tid]'))) return accionTiendas(el.dataset.tact, [el.dataset.tid]);
    if (t.closest('[data-tnew]')) return openNuevaTienda();
    if ((el = t.closest('[data-tsel]'))) return selTienda(el.dataset.tsel);
    if ((el = t.closest('[data-tchip]'))) { S.tienda.filtro = el.dataset.tchip; S.tienda.page = 1; const f = $('#tFiltro'); if (f) f.value = S.tienda.filtro; return updateTiendas(); }
    if ((el = t.closest('[data-texp]'))) return exportTiendas(el.dataset.texp);
    if ((el = t.closest('[data-tedit]'))) return openEditTienda(el.dataset.tedit);
    if (t.closest('[data-timp]')) return openImportTiendas();
    if ((el = t.closest('[data-pchip]'))) { S.pend.tec = S.pend.tec === el.dataset.pchip ? '' : el.dataset.pchip; S.pend.page = 1; buildPend(); return; }
    if ((el = t.closest('[data-pact]'))) return pendAction(el.dataset.pact);
    if ((el = t.closest('[data-teamgo]'))) { const u = el.dataset.u; S.filtroTec = u; S.pend.tec = u; return go(el.dataset.teamgo); }
    if ((el = t.closest('[data-aact]'))) {
      const k = el.dataset.aact, a = S.asig;
      if (k === 'todos') { (S.asigFiltered || []).forEach(c => a.sel.add(c.ID_Cliente)); updateAsigList(); updateAsigPlan(); }
      else if (k === 'limpiar') { a.sel.clear(); updateAsigList(); updateAsigPlan(); }
      else if (k === 'pegar') $('#aPasteBox').classList.toggle('hidden');
      else if (k === 'aplicarids') aplicarIds();
      else if (k === 'tec-todos') { S.usuarios.forEach(u => a.tecs.add(u.Usuario)); updateAsigPlan(); }
      else if (k === 'tec-ninguno') { a.tecs.clear(); updateAsigPlan(); }
      else if (k === 'ejecutar') ejecutarAsig();
      else if (k === 'irplan') $('#aPlan').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  root.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'hQ') { S.hist.q = e.target.value; S.hist.page = 1; updateHist(); }
    else if (id === 'pQ') { S.pend.q = e.target.value; S.pend.page = 1; updatePend(); }
    else if (id === 'tQ') { S.tienda.q = e.target.value; S.tienda.page = 1; updateTiendas(true); }
    else if (id === 'aQ') { S.asig.q = e.target.value; S.asig.page = 1; updateAsigList(); }
  });

  root.addEventListener('change', e => {
    const t = e.target, id = t.id;
    if (t.classList.contains('f-tec')) { S.filtroTec = t.value; S.drill = null; S.hist.page = 1; renderCurrent(false); return; }
    if (id === 'hTipo') { S.hist.tipo = t.value; S.hist.page = 1; updateHist(); }
    else if (id === 'hStatus') { S.hist.status = t.value; S.hist.page = 1; updateHist(); }
    else if (id === 'tFiltro') { S.tienda.filtro = t.value; S.tienda.page = 1; updateTiendas(true); }
    else if (id === 'tDist') { S.tienda.distrito = t.value; S.tienda.page = 1; updateTiendas(true); }
    else if (id === 'hFuera') { S.hist.fuera = t.checked; S.hist.page = 1; updateHist(); }
    else if (id === 'pTec') { S.pend.tec = t.value; S.pend.page = 1; updatePend(); }
    else if (id === 'pAtr') { S.pend.soloAtras = t.checked; S.pend.page = 1; updatePend(); }
    else if (id === 'pAll') { const l = S.pendList || []; if (t.checked) l.forEach(v => S.pend.sel.add(v.ID_Visita)); else l.forEach(v => S.pend.sel.delete(v.ID_Visita)); updatePend(); }
    else if (t.dataset.pid) { t.checked ? S.pend.sel.add(t.dataset.pid) : S.pend.sel.delete(t.dataset.pid); updatePendBar(); }
    else if (id === 'aOcultar') { S.asig.ocultarPend = t.checked; S.asig.page = 1; updateAsigList(); updateAsigPlan(); }
    else if (t.dataset.cid) { t.checked ? S.asig.sel.add(t.dataset.cid) : S.asig.sel.delete(t.dataset.cid); updateAsigCount(); updateAsigPlan(); }
    else if (t.name === 'amodo') { S.asig.modo = t.value; updateAsigPlan(); }
    else if (id === 'aDestino') { S.asig.destino = t.value; updateAsigPlan(); }
    else if (id === 'aOmitir') { S.asig.omitir = t.checked; updateAsigPlan(); }
    else if (t.dataset.atec) { t.checked ? S.asig.tecs.add(t.dataset.atec) : S.asig.tecs.delete(t.dataset.atec); updateAsigPlan(); }
    else if (id === 'segN' || id === 'segU') {
      const n = Math.max(1, Math.min(999, Math.round(+$('#segN').value) || 24));
      try { localStorage.setItem(SEGU_KEY, JSON.stringify({ n, u: $('#segU').value === 'd' ? 'd' : 'h' })); } catch (_) {}
      renderCurrent(false);
    }
    else if (id === 'lgFiltro') { S.logsFiltro = t.value; renderLogs(); }
  });

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.token) loadData(true); });
}

/* ---------- Instalación como app (PWA) ---------- */
let deferredPrompt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/i.test(navigator.userAgent) || (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
function refreshInstallUI() { $$('.js-install').forEach(b => b.classList.toggle('hidden', isStandalone())); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; refreshInstallUI(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; refreshInstallUI(); toast('App instalada', 'ok'); });
async function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch (_) {}
    deferredPrompt = null; refreshInstallUI(); return;
  }
  const pasos = isIOS()
    ? ['Abre esta página en <b>Safari</b>.', 'Toca el botón <b>Compartir</b> (cuadrado con flecha).', 'Elige <b>“Agregar a pantalla de inicio”</b> y confirma con <b>Agregar</b>.']
    : ['Abre el menú del navegador <b>⋮</b> (Chrome o Brave).', 'Elige <b>“Instalar app”</b> o <b>“Agregar a la pantalla de inicio”</b>.', 'Confirma con <b>Instalar</b>.'];
  openModal(`<div class="p-5 space-y-3"><div class="text-lg font-bold">Instalar el Panel de Supervisión</div>
    <ol class="list-decimal pl-5 space-y-2 text-sm text-slate-700">${pasos.map(x => `<li>${x}</li>`).join('')}</ol>
    <p class="text-xs text-slate-500">Se instala como una app aparte, con su propio ícono (azul marino con gráfico), distinta de la app de técnicos.</p>
    <button class="btn btn-primary w-full" data-close>Entendido</button></div>`);
}

function init() {
  bindEvents();
  document.addEventListener('click', e => { if (e.target.closest('.js-install')) installApp(); });
  refreshInstallUI();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (typeof Chart !== 'undefined') { Chart.defaults.font.family = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'; Chart.defaults.color = '#475569'; }
  const ses = loadSession();
  if (ses && ses.token && ses.user && ses.user.Rol === 'Supervisor') { S.token = ses.token; S.user = ses.user; enterApp(); }
  else showLogin();
}
init();
})();
</script>
